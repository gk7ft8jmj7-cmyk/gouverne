<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1C2B3D">
<title>Page introuvable · Gouverne</title>
<link rel="icon" href="/gouverne/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#1C2B3D;color:#AFC0D2;font-family:'Schibsted Grotesk','Helvetica Neue',Arial,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.logo{font-weight:900;font-size:clamp(40px,14vw,64px);letter-spacing:-.045em;line-height:1;color:#fff;-webkit-text-stroke:1px currentColor}
.n{font-weight:900;font-size:clamp(88px,28vw,150px);letter-spacing:-.05em;line-height:1;color:#2E5E99;-webkit-text-stroke:1px currentColor;margin:34px 0 6px}
h1{font-size:22px;margin:0 0 8px;color:#fff;font-weight:600}
p{margin:0 0 28px;max-width:380px}
a.b{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 24px;border-radius:9px;background:#fff;color:#1C2B3D;font-weight:600;text-decoration:none;transition:opacity .2s ease,transform .12s ease}
a.b:hover{opacity:.9}a.b:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){body{animation:none}}
</style>
</head>
<body>
<div class="logo">gouverne.</div>
<div class="n">404</div>
<h1>Cette page n’existe pas.</h1>
<p>Le lien est peut-être incomplet, ou la page a été déplacée.</p>
<a class="b" id="home" href="/">Retour à Gouverne</a>
<script>
// GitHub Pages : le site vit dans /gouverne/ ; sur un domaine à soi (OVH), à la racine
(function(){ var gh = /\.github\.io$/.test(location.hostname), base = gh ? '/gouverne/' : '/';
  document.getElementById('home').href = base;
  var i = document.querySelector('link[rel=icon]'); if (i) i.href = base + 'favicon.ico'; })();
</script>
</body>
</html>
