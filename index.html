<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Gouverne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ground:#F7F7F5;--surface:#fff;--sunk:#F2F2EF;--line:#E2E2DD;--line2:#CFCFCA;--ctrl:#8E939A;--ink:#1A1E24;--muted:#5A606A;--faint:#656B75;--navy:#1C2B3D;--navy2:#2A3A4E;--danger:#7A1F2B}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Schibsted Grotesk','Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;letter-spacing:-.015em}
.brand{font-size:33px;font-weight:900;letter-spacing:-.045em;line-height:1;-webkit-text-stroke:.6px currentColor}
.btn{height:44px;padding:0 18px;border-radius:9px;border:1px solid var(--ctrl);background:var(--surface);font-weight:600;font-size:15px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{height:44px;border:1px solid var(--ctrl);border-radius:9px;padding:0 12px;background:var(--surface);color:var(--ink);font-weight:400;font-size:15px}
.field textarea{height:auto;min-height:110px;padding:10px 12px}
.err{color:var(--danger);font-weight:600;font-size:14px;margin:0;min-height:1em}
.hint{font-size:13px;color:var(--muted);font-weight:400}
/* auth */
.login{display:flex;min-height:100vh}
.lside{flex:0 0 40%;background:var(--navy);color:#E6EAF0;padding:40px;display:flex;flex-direction:column;justify-content:space-between}
.lside .brand{color:#fff;font-size:64px;-webkit-text-stroke:1px currentColor}
.sbox>.brand{font-size:52px;-webkit-text-stroke:1px currentColor}
@media (max-width:800px){.lside .brand{font-size:48px}.sbox>.brand{font-size:42px}}
.lside p{font-size:24px;line-height:1.35;margin:0;color:#fff;max-width:26ch}
.lside small{color:#A8B3C2}
.lmain{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.lbox{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.lbox h1{font-size:32px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:9px;border-radius:8px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,45,.12)}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:13px}.or::before,.or::after{content:'';flex:1;border-top:1px solid var(--line)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
form{display:flex;flex-direction:column;gap:14px}
/* setup */
.setup{min-height:100vh;display:flex;justify-content:center;padding:48px 20px}
.sbox{width:100%;max-width:760px;display:flex;flex-direction:column;gap:18px}
.sbox h1{font-size:32px}
.steps{display:flex;align-items:center;gap:6px}.steps span{width:26px;height:26px;border-radius:13px;border:2px solid var(--ctrl);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)}
.steps span.on{background:var(--ink);border-color:var(--ink);color:#fff}.steps i{width:28px;height:2px;background:var(--line2)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.type{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px;border:1px solid var(--line2);border-radius:14px;background:var(--surface)}
.type b{font-size:17px}.type small{color:var(--muted);font-size:14px}
.type[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunk)}
.sw{width:10px;height:10px;border-radius:5px;display:inline-block}
.foot{display:flex;justify-content:space-between;align-items:center}
/* app */
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--navy);color:#E6EAF0;padding:28px 16px;display:flex;flex-direction:column;gap:24px}
.side .brand{color:#fff;padding:0 10px}
.side small{color:#A8B3C2;padding:0 10px}
.me{margin-top:auto;padding:0 10px;display:flex;flex-direction:column;gap:8px}
.me button{background:none;border:1px solid #33465C;color:#DDE3EA;border-radius:8px;height:36px}
main{flex:1;min-width:0;padding:36px 44px 64px;display:flex;flex-direction:column;gap:22px}
main h1{font-size:36px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.panel h2{font-size:18px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.ok{background:var(--surface);border:1px solid var(--line);border-left:0;border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.dot{width:10px;height:10px;border-radius:5px;background:#2F6B3A;flex:none}
.explain{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:15px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pcard{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border:1px solid var(--line2);border-radius:12px;background:var(--surface)}
.pcard b{display:block;font-size:16px}.pcard small{color:var(--muted);font-size:13px}
.pcard[aria-pressed="false"]{background:var(--sunk);color:var(--muted)}
.pcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pcheck{width:22px;height:22px;border-radius:6px;border:2px solid var(--ctrl);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none;color:#fff}
.pcard[aria-pressed="true"] .pcheck{background:var(--ink);border-color:var(--ink)}
.addrow{flex-direction:row;align-items:flex-end;gap:10px}
.members{display:flex;flex-direction:column;gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.mtop{display:flex;gap:10px;align-items:flex-end}
.xbtn{width:44px;height:44px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font-size:22px;color:var(--muted)}
.pchip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.pchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.addm{align-self:flex-start;border-style:dashed}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.head h1{font-size:36px}.sub{margin:6px 0 0;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{text-align:left;border:0;background:transparent;color:#BAC4D1;padding:11px 12px;border-radius:8px;font-family:'Manrope',sans-serif;font-size:15px;font-weight:500}
.nav button[aria-current="page"]{background:var(--navy2);color:#fff;font-weight:600}
.pill{flex:none;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}
.pill.ok{background:#EFF0F1;color:var(--ink)}.pill.todo{background:#F3EAD6;color:#6A4A12}.pill.busy{background:var(--sunk);color:var(--muted)}.pill.free{border:1px solid var(--line2);color:var(--faint)}
.whoblk{padding:10px 0;border-top:1px solid var(--line)}.whoblk:first-of-type{border-top:0}.whoblk>b{display:block;margin-bottom:4px}
.trow{width:100%;display:flex;gap:10px;align-items:center;border:0;background:none;padding:7px 0;text-align:left}
.th{width:44px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}.tbar{width:4px;align-self:stretch;border-radius:2px;flex:none}.tm{flex:1;min-width:0}.tm b{display:block;font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.search{flex:1;min-width:240px;height:44px;border:1px solid var(--ctrl);border-radius:10px;padding:0 14px;background:var(--surface)}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:7px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,45,.12)}
table{width:100%;border-collapse:collapse}th{font-size:13px;font-weight:600;color:var(--faint);text-align:left;padding:0 12px 10px 0}td{border-top:1px solid var(--line);padding:12px 12px 12px 0}td.num{text-align:right}
.src{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px}.src i{width:10px;height:10px;border-radius:5px}
.phead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:8px}
.weeknav{display:flex;align-items:center;gap:10px}.btn.small{height:34px;padding:0 12px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:5px;display:inline-block}
.planwrap{overflow-x:auto}
.plan{min-width:880px;display:grid;grid-template-columns:150px repeat(14,minmax(0,1fr))}
.plan .dh{font-size:12px;color:var(--faint);padding:0 0 8px 6px}.plan .dh b{display:block;color:var(--ink);font-size:15px}.plan .dh.tod{font-weight:700;color:var(--ink)}
.plan .rn{grid-column:1;padding:12px 10px 12px 0;border-top:1px solid var(--line);font-weight:600;display:flex;flex-direction:column;justify-content:center}.plan .rn small{font-weight:400;color:var(--faint)}
.plan .cell{border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);min-height:54px;background:transparent;padding:0}.plan .cell:hover{background:var(--sunk)}.plan .cell.we{background:var(--sunk)}.plan .cell.tod{background:rgba(26,30,36,.05);box-shadow:inset 2px 0 0 var(--ink)}
.resa{align-self:center;height:38px;margin:0 2px;border-radius:6px;padding:0 10px;border:0;color:#fff;font-size:13px;font-weight:600;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.scrim{position:fixed;inset:0;background:rgba(15,21,28,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{position:relative;background:var(--surface);border-radius:16px;padding:26px;width:620px;max-width:100%;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:22px;padding-right:44px}
.mclose{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:20px;border:0;background:transparent;color:var(--muted);font-size:26px}
.mclose:hover{background:var(--sunk)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0}.box legend{font-weight:700;font-size:14px;padding:0 6px}
.prow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.ochip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;min-width:160px}
.ochip input{width:17px;height:17px;accent-color:var(--ink);margin:0}
.wsel{height:38px;border:1px solid var(--ctrl);border-radius:8px;padding:0 10px;background:var(--surface);min-width:190px}.wsel:disabled{opacity:.45}
.tlab{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.tsel{height:38px;border:1px solid var(--ctrl);border-radius:8px;padding:0 8px;background:var(--surface)}.tsel:disabled{opacity:.45}
.optgrp{margin-bottom:10px}.optp{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}.optp i{width:10px;height:10px;border-radius:5px;display:inline-block}
.optgrp .ochip{min-width:0}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.link.danger{color:var(--danger)}
.infos{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}.infos div{display:flex;justify-content:space-between;gap:10px}.infos span{color:var(--muted)}
.note{background:#F3EAD6;color:#6A4A12;border-radius:10px;padding:10px 12px;font-size:14px}.note b{display:block;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:70;font-weight:600;max-width:calc(100% - 32px)}
html,body{max-width:100%;overflow-x:hidden;overscroll-behavior:none}
html{background:var(--ground)}
.mhead,.mscrim{display:none}
@media (max-width:800px){
  .app{flex-direction:column}
  .mhead{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;min-height:64px;padding:env(safe-area-inset-top,0px) 14px 0}.mhead .brand{font-size:32px;color:#fff}
  .mhead{transition:transform .22s ease}.mhead.hide{transform:translateY(-100%)}
  .app,main{max-width:100vw;overflow-x:hidden}
  .hamb{width:42px;height:42px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.hamb span{display:block;width:20px;height:2px;background:#fff}
  .side{position:fixed;top:0;left:0;bottom:0;width:84%;max-width:300px;z-index:60;transform:translateX(-102%);transition:transform .2s;flex-direction:column!important;align-items:stretch!important;padding:22px 14px!important}
  .menu-open .side{transform:none}.menu-open .mscrim{display:block;position:fixed;inset:0;background:rgba(15,21,28,.45);z-index:55}
  .side small{display:block!important}.me{margin:auto 0 0!important;flex-direction:column!important}
  .head h1{font-size:24px}.fgrid{grid-template-columns:1fr}.modal{padding:20px 16px}
}
.dchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.dchips button{flex:none;min-width:70px;border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:1px}
.dchips small{font-size:12px;color:var(--muted)}.dchips b{font-size:18px}.dchips i{font-style:normal;font-size:11px;color:var(--faint)}
.dchips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}.dchips button[aria-pressed="true"] small,.dchips button[aria-pressed="true"] i{color:#C9CFD8}
.tlwrap{overflow-x:auto}
.tl{min-width:860px;display:grid;grid-template-columns:150px repeat(32,minmax(0,1fr))}
.tlh,.tlr{display:contents}
.tlh span{font-size:12px;color:var(--faint);padding-bottom:8px}
.tlw{grid-column:1;padding:10px 10px 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}.tlw small{color:var(--faint);font-size:12px}
.tlr.un .tlw b{color:#6A4A12}
.tlr{position:relative}
.tlr>.blk,.tlr>.tlnow{grid-row:auto}
.tlbg{grid-column:2 / -1;border-top:1px solid var(--line);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100% / 16) 100%;min-height:62px}
.tlr.alt .tlbg{background-color:#FAFAF8}
.tlh span{border-left:1px solid var(--line2);padding-left:4px}
.blk{height:44px!important;display:flex;flex-direction:column;justify-content:center;line-height:1.2;box-shadow:0 1px 2px rgba(20,30,45,.18);z-index:1;position:relative}
.blk small{font-size:11px;font-weight:700;opacity:.85}
.blk:hover{filter:brightness(1.08)}
.blk{align-self:center;height:36px;margin:4px 1px;border-radius:6px;border:0;padding:0 8px;font-size:12px;font-weight:600;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.blk.done{background:var(--sunk);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line2)}
.tlnow{width:2px;background:#A4372A;justify-self:start;align-self:stretch;border-top:1px solid var(--line)}
.onlymob{display:none}
@media (max-width:800px){.onlydesk{display:none}.onlymob{display:block}}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted)}
@media (max-width:800px){.login{flex-direction:column}.lside{flex:none;padding:24px;gap:16px}.lside p{font-size:18px}
  .app{flex-direction:column}.side{width:auto;flex-direction:row;align-items:center;padding:12px 14px;gap:12px}.side small{display:none}.me{margin:0 0 0 auto;flex-direction:row}
  main{padding:18px 14px 40px}main h1{font-size:26px}.sbox h1,.lbox h1{font-size:26px}}
/* équipe, dispos, appli employé */
.scard{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line2);border-left-width:5px;border-radius:12px;padding:14px;margin:8px 0;box-shadow:0 1px 2px rgba(20,30,45,.06)}
.scard:active{transform:scale(.99)}.scard .th{font-size:17px}
.scard .tm b{font-size:16px}.scard .prog{font-size:12px;font-weight:700;color:var(--muted);margin-top:4px;display:block}
.scard .go{flex:none;display:flex;align-items:center;gap:4px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:9px 12px;border-radius:9px}

.tcard{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}.tcard:first-of-type{border-top:0}

.k-repos{background:#ECECE8!important;color:#5A606A!important}
.k-conges{background:#F1EAD9!important;color:#6B5726!important;border-color:#E3D6B5!important}

.kopt{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:10px;padding:11px 12px;font-weight:600;cursor:pointer}.kopt input{accent-color:var(--ink);margin:0;width:17px;height:17px}

const PAL = [['#3F444B','#fff'],['#A88D63','#1F180A'],['#D2A24C','#2E2108'],['#D4A39B','#3B1D18'],['#6E7B5B','#fff'],['#4F6A6E','#fff']];

// Modèles de départ par type d'établissement
const TPL = {
  ch:{label:'Chambres d’hôtes',hint:'Quelques chambres, petit-déjeuner, parfois table d’hôtes ou soins',unitS:'Chambre',unitP:'Chambres',q:'Combien de chambres ?',n:4,
    poles:[['menage','Ménage',['Draps et serviettes changés','Salle de bain nettoyée','Sols aspirés et lavés','Produits d’accueil remis']],['accueil','Accueil',['Clés prêtes','Chambre vérifiée','Présentation des lieux']],['resto','Petit-déjeuner',['Mise en place','Service','Rangement']]],

    opts:[['Anniversaire','service'],['Menu allergènes','cuisine']]},

const ERR = {
  'auth/invalid-email':'Cette adresse email n’est pas valide.',
  'auth/missing-password':'Indiquez un mot de passe.',
  'auth/weak-password':'Le mot de passe doit faire au moins 6 caractères.',

const msg = e => ERR[e && e.code] || ('Une erreur est survenue' + (e && e.code ? ' (' + e.code + ')' : '') + '.');

/* ---------- écran de connexion ---------- */
let tab = 'in';
function renderLogin(){
  root.innerHTML = `<div class="login"><aside class="lside"><div class="brand">gouverne.</div><p>Les chambres, l’équipe et les tâches de votre établissement, sur un seul écran.</p><small>Données hébergées en Europe. Vos données vous appartiennent.</small></aside>
  <main class="lmain"><div class="lbox">
    <div class="tabs" role="tablist"><button type="button" data-tab="in" aria-pressed="${tab==='in'}">Se connecter</button><button type="button" data-tab="up" aria-pressed="${tab==='up'}">Créer mon établissement</button></div>
    ${tab==='in' ? `<h1>Bonjour</h1>
      <form id="fin"><label class="field">Adresse email<input type="email" name="email" autocomplete="email" required></label>
      <label class="field">Mot de passe<input type="password" name="pw" autocomplete="current-password" required></label>
      <p class="err" id="err"></p><button class="btn primary" type="submit">Se connecter</button>
      <button type="button" class="link" id="forgot" style="align-self:flex-start">Mot de passe oublié ?</button></form>`
    : `<h1>Créez votre établissement</h1>
      <form id="fup"><label class="field">Votre prénom<input name="fn" autocomplete="given-name" required></label>
      <label class="field">Adresse email<input type="email" name="email" autocomplete="email" required></label>
      <label class="field">Mot de passe<input type="password" name="pw" autocomplete="new-password" minlength="8" required><span class="hint">8 caractères minimum</span></label>
      <p class="err" id="err"></p><button class="btn primary" type="submit">Créer mon compte</button></form>`}
    <div class="or">ou</div>
    <button type="button" class="btn gbtn" id="google"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continuer avec Google</button>

/* ---------- assistant de première connexion ---------- */
let setup = null;
const slug = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,24) || ('pole_' + Date.now().toString(36));
function initPoles(type){ return TPL[type].poles.map(p => ({ id:p[0], name:p[1], checks:p[2].slice(), on:true })); }
function renderSetup(user){
  if (!setup) setup = { step:1, type:null, es:'', n:null, poles:[], team:[], fn:(user.displayName||'').split(' ')[0] || '' };
  const st = setup, t = st.type ? TPL[st.type] : null;
  const steps = '<div class="steps">'+[1,2,3,4].map(i=>`<span class="${i<=st.step?'on':''}">${i}</span>`).join('<i></i>')+'</div>';
  const chosen = st.poles.filter(p => p.on);
  let body = '';
  if (st.step === 1) body = `<h1>Bienvenue${st.fn ? ' ' + esc(st.fn) : ''}</h1><p class="hint" style="font-size:15px;margin:-8px 0 0">Quel est votre type d’établissement ? Gouverne se prépare en fonction.</p>
    <div class="types">${Object.entries(TPL).map(([k,v])=>`<button type="button" class="type" data-type="${k}" aria-pressed="${st.type===k}"><b>${v.label}</b><small>${v.hint}</small></button>`).join('')}</div>
    <div class="foot"><span></span><button type="button" class="btn primary" id="next" ${st.type?'':'disabled'}>Continuer</button></div>`;
  if (st.step === 2) body = `<h1>Votre établissement</h1>
    <form id="f2"><label class="field">Nom de l’établissement<input name="es" required value="${esc(st.es)}" placeholder="Par exemple : Bastide des Oliviers"></label>
    <label class="field">${t.q}<input name="n" type="number" min="1" max="60" value="${st.n || t.n}"></label>
    <div class="foot"><button type="button" class="link" id="back">Retour</button><button class="btn primary" type="submit">Continuer</button></div></form>`;
  if (st.step === 3) body = `<h1>Vos pôles de travail</h1>
    <div class="explain"><b>Un pôle, c’est un type de travail</b> : le ménage, l’accueil, le petit-déjeuner… Chaque pôle a ses propres tâches et sa liste de choses à vérifier, et chaque personne de l’équipe peut travailler sur un ou plusieurs pôles.</div>
    <p class="hint" style="font-size:15px;margin:0">Gardez ceux qui vous servent, retirez les autres, ajoutez les vôtres.</p>
    <div class="pgrid">${st.poles.map((p,i)=>`<button type="button" class="pcard" data-pole="${i}" aria-pressed="${p.on}"><span class="pcheck" aria-hidden="true">${p.on?'✓':''}</span><span><b>${esc(p.name)}</b><small>${p.checks.length ? esc(p.checks.slice(0,3).join(', ')) + (p.checks.length>3?'…':'') : 'Liste à compléter plus tard'}</small></span></button>`).join('')}</div>
    <form id="fpole" class="addrow"><label class="field" style="flex:1">Ajouter un pôle<input name="name" placeholder="Par exemple : Piscine, Jardin, Spa" required></label><button class="btn" type="submit">Ajouter</button></form>
    <p class="err" id="err"></p>
    <div class="foot"><button type="button" class="link" id="back">Retour</button><button type="button" class="btn primary" id="next3">Continuer</button></div>`;
  if (st.step === 4) body = `<h1>Votre équipe</h1>
    <p class="hint" style="font-size:15px;margin:-8px 0 0">Facultatif. Ajoutez les personnes qui travaillent avec vous et choisissez leurs pôles. Vous leur enverrez leur accès ensuite.</p>
    <div class="members">${st.team.map((m,i)=>`<div class="mcard"><div class="mtop"><label class="field" style="flex:1">Prénom<input data-mname="${i}" value="${esc(m.name)}" placeholder="Prénom"></label><button type="button" class="xbtn" data-mdel="${i}" aria-label="Retirer">×</button></div>
      <div class="field">Pôles<div class="chips">${chosen.map(p=>`<button type="button" class="pchip" data-mp="${i}" data-pid="${p.id}" aria-pressed="${m.poles.includes(p.id)}">${esc(p.name)}</button>`).join('')}</div></div></div>`).join('')}
      <button type="button" class="btn addm" id="addm">+ Ajouter un membre</button></div>
    <p class="err" id="err"></p>
    <div class="foot"><button type="button" class="link" id="back">Retour</button><button type="button" class="btn primary" id="create">Créer mon espace</button></div>`;
  root.innerHTML = `<div class="setup"><div class="sbox"><div class="brand">gouverne.</div>${steps}${body}</div></div>`;
  root.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { if (st.type !== b.dataset.type){ st.type = b.dataset.type; st.n = null; st.poles = initPoles(st.type); st.team.forEach(m => m.poles = []); } renderSetup(user); });
  if ($('#next')) $('#next').onclick = () => { st.step = 2; renderSetup(user); };
  if ($('#back')) $('#back').onclick = () => { st.step--; renderSetup(user); };
  if ($('#f2')) $('#f2').onsubmit = e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target)); st.es = d.es.trim(); st.n = Math.max(1, +d.n || 1); st.step = 3; renderSetup(user); };
  root.querySelectorAll('[data-pole]').forEach(b => b.onclick = () => { const p = st.poles[+b.dataset.pole]; p.on = !p.on; renderSetup(user); });
  if ($('#fpole')) $('#fpole').onsubmit = e => { e.preventDefault(); const nm = new FormData(e.target).get('name').trim(); if (!nm) return;
    let id = slug(nm); while (st.poles.some(p => p.id === id)) id += '_2'; st.poles.push({ id, name:nm, checks:[], on:true }); renderSetup(user); };
  if ($('#next3')) $('#next3').onclick = () => { if (!st.poles.some(p => p.on)) { $('#err').textContent = 'Gardez au moins un pôle.'; return; } if (!st.team.length) st.team.push({ name:'', poles: st.poles.filter(p=>p.on).map(p=>p.id).slice(0,1) }); st.step = 4; renderSetup(user); };
  root.querySelectorAll('[data-mname]').forEach(inp => inp.oninput = () => { st.team[+inp.dataset.mname].name = inp.value; });
  root.querySelectorAll('[data-mdel]').forEach(b => b.onclick = () => { st.team.splice(+b.dataset.mdel, 1); renderSetup(user); });
  root.querySelectorAll('[data-mp]').forEach(b => b.onclick = () => { const m = st.team[+b.dataset.mp], id = b.dataset.pid; m.poles = m.poles.includes(id) ? m.poles.filter(x => x !== id) : m.poles.concat(id); renderSetup(user); });
  if ($('#addm')) $('#addm').onclick = () => { st.team.push({ name:'', poles:[] }); renderSetup(user); setTimeout(() => { const ins = root.querySelectorAll('[data-mname]'); ins[ins.length-1].focus(); }, 0); };
  if ($('#create')) $('#create').onclick = async () => {
    const team = st.team.filter(m => m.name.trim());
    if (team.some(m => !m.poles.length)) { $('#err').textContent = 'Choisissez au moins un pôle pour chaque membre.'; return; }
    $('#create').disabled = true; $('#create').textContent = 'Création…';
    try { await createEstablishment(user, st, team); setup = null; await route(user); }
    catch(x){ console.error(x); $('#err').textContent = msg(x); $('#create').disabled = false; $('#create').textContent = 'Créer mon espace'; } };
}

async function createEstablishment(user, st, team){
  const t = TPL[st.type];
  const poles = st.poles.filter(p => p.on);
  const ids = poles.map(p => p.id);
  const eRef = doc(collection(db, 'etablissements'));
  const eid = eRef.id;
  const b = writeBatch(db);
  b.set(eRef, {
    name: st.es, type: st.type, unitS: t.unitS, unitP: t.unitP, ownerUid: user.uid, createdAt: serverTimestamp(),
    options: t.opts.filter(o => ids.includes(o[1])).map(o => ({ label:o[0], pole:o[1] })),
    settings: { heuresPaie:false, sync:false, recouche:0, photos:{}, durees:{ prep:1.5, accueil:0.5 } }
  });
  const ownerPid = 'p_' + user.uid.slice(0, 8);
  b.set(doc(db, 'etablissements', eid, 'equipe', ownerPid), { name: st.fn || user.displayName || 'Propriétaire', role:'proprio', uid:user.uid, poles: ids.slice(0,2), sites:['s1'], createdAt: serverTimestamp() });
  b.set(doc(db, 'etablissements', eid, 'membres', user.uid), { role:'proprio', personId: ownerPid, email: user.email || '', createdAt: serverTimestamp() });
  team.forEach((m, i) => {
    b.set(doc(db, 'etablissements', eid, 'equipe', 'p' + Date.now().toString(36) + i), { name: m.name.trim(), role:'collab', uid:null, poles: m.poles, sites:['s1'], access:'a_inviter', createdAt: serverTimestamp() });
  });
  const rooms = Array.from({ length: st.n || t.n }, (_, i) => (t.names && t.names[i]) || (t.unitS + ' ' + (i + 1)));
  b.set(doc(db, 'etablissements', eid, 'sites', 's1'), { name: st.es, rooms, order: 0 });
  poles.forEach((p, i) => b.set(doc(db, 'etablissements', eid, 'poles', p.id), { name:p.name, color:PAL[i%PAL.length][0], fg:PAL[i%PAL.length][1], checks:p.checks.length ? p.checks : ['Fait'], fields:[], order:i }));
  await b.commit();
  await setDoc(doc(db, 'users', user.uid), { eid, createdAt: serverTimestamp() }, { merge: true });
}

/* ---------- espace gérante : tableau de bord + réservations ---------- */
const DAYS = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const MONTHS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const todayISO = () => iso(new Date());
const dLabel = s => { const d = parse(s); return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; };
const dTitle = s => { const t = parse(s).toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' }); return t.charAt(0).toUpperCase() + t.slice(1); };
const hm = h => { const H = Math.floor(h), M = Math.round((h - H) * 60); return H + ':' + pad(M); };
const SRC = { Direct:'#7A6638', Booking:'#2E4A6B', Airbnb:'#B4544A', Autre:'#3F6E52' };

const A = { user:null, eid:null, E:null, sites:[], poles:[], team:[], resas:[], tasks:[], dispos:[], incidents:[], role:'', pid:'', view:'today', rmode:'cal', q:'', unsub:[] };
const poleOf = id => A.poles.find(p => p.id === id) || { name:id, color:'#CFCFCA', fg:'#1A1E24' };
const personOf = id => A.team.find(m => m.id === id);
const siteOf = id => A.sites.find(s => s.id === id) || { name:'' };

function toast(t){ document.querySelectorAll('.toast').forEach(x => x.remove()); const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role','status'); d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 4000); }
function modal(html){ const l = document.createElement('div'); l.className = 'scrim'; l.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><button type="button" class="mclose" aria-label="Fermer">×</button>' + html + '</div>'; document.body.appendChild(l);
  l.addEventListener('click', e => { if (e.target === l || e.target.closest('.mclose') || e.target.closest('[data-close]')) closeModal(); });
  const f = l.querySelector('input:not([type=hidden]),select,textarea'); if (f) f.focus(); return l; }
const closeModal = () => { document.querySelectorAll('.scrim').forEach(x => x.remove()); if (A.dirty) { A.dirty = 0; draw(); } };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

async function renderApp(user, eid){
  A.unsub.forEach(u => u()); A.unsub = [];
  Object.assign(A, { user, eid, resas:[], tasks:[], dispos:[], incidents:[], team:[] });
  root.innerHTML = '<div class="loading">Chargement de votre établissement…</div>';
  const mb = await getDoc(doc(db, 'etablissements', eid, 'membres', user.uid));
  if (!mb.exists()) { A.eid = null; return msgScreen('Votre accès à cet établissement a été retiré. Contactez votre responsable.', 'Se déconnecter', () => signOut(auth)); }
  A.role = mb.data().role; A.pid = mb.data().personId || '';
  const ges = A.role !== 'collab';
  const e = await getDoc(doc(db, 'etablissements', eid));
  if (!e.exists()) { root.innerHTML = '<div class="loading">Établissement introuvable.</div>'; return; }
  A.E = e.data();
  const [sites, poles] = await Promise.all(['sites','poles'].map(c => getDocs(collection(db, 'etablissements', eid, c))));
  A.sites = sites.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => (a.order||0) - (b.order||0));
  A.poles = poles.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => (a.order||0) - (b.order||0));
  const views = ges ? ['today','resas','tasks','team'] : ['mine','dispos'];
  if (!views.includes(A.view)) A.view = views[0];
  const col = c => collection(db, 'etablissements', eid, c);
  const src = ges ? { resas:col('reservations'), tasks:col('taches'), team:col('equipe'), dispos:col('dispos'), incidents:col('incidents') }
                  : { tasks:query(col('taches'), where('who', '==', A.pid)), team:col('equipe'), dispos:query(col('dispos'), where('pid', '==', A.pid)) };
  const got = new Set(), keys = Object.keys(src);
  keys.forEach(k => A.unsub.push(onSnapshot(src[k], s => { A[k] = s.docs.map(d => ({ id:d.id, ...d.data() })); got.add(k); if (keys.every(x => got.has(x)) && !document.querySelector('.scrim')) draw(); else if (keys.every(x => got.has(x))) A.dirty = 1; }, err => showErr(err))));
}
function showErr(x){ console.error(x); root.innerHTML = `<div class="loading" style="padding:20px;text-align:center">${esc(msg(x))}<br><br><button class="btn" onclick="location.reload()">Réessayer</button></div>`; }

function draw(){
  const keepScroll = window.scrollY;
  const ges = A.role !== 'collab';
  const nav = ges ? [['today','Tableau de bord'],['resas','Réservations'],['tasks','Planning d’équipe'],['team','Équipe']] : [['mine','Mon planning'],['dispos','Mes dispos']];
  root.innerHTML = `<div class="app${A.menu?' menu-open':''}">
    <header class="mhead"><button type="button" class="hamb" data-a="menu" aria-label="Ouvrir le menu"><span></span><span></span><span></span></button><div class="brand">gouverne.</div></header>
    <div class="mscrim" data-a="menuclose"></div>
    <nav class="side" aria-label="Navigation principale"><div class="brand">gouverne.</div><small>${esc(A.E.name)}${ges ? '' : ' · ' + esc(me().name)}</small>
      <div class="nav">${nav.map(n => `<button type="button" data-a="view" data-v="${n[0]}" ${A.view===n[0]?'aria-current="page"':''}>${n[1]}</button>`).join('')}${ges ? '' : '<button type="button" class="navx" data-a="report">Signaler un problème</button>'}</div>
      <div class="me"><small style="padding:0">${esc(A.user.email || '')}</small><button type="button" data-a="logout">Se déconnecter</button></div></nav>
    <main>${({ resas:vResas, tasks:vTasks, team:vTeam, mine:vMine, dispos:vDispos }[A.view] || vToday)()}</main></div>`;
  window.scrollTo(0, keepScroll);
}

/* ---------- tableau de bord ---------- */
function vToday(){
  const t = todayISO();
  const ts = A.tasks.filter(x => x.day === t).sort((a,b) => a.start - b.start);
  const arr = A.resas.filter(r => r.from === t), dep = A.resas.filter(r => addDays(r.from, r.nights) === t);
  const rooms = []; A.sites.forEach(s => s.rooms.forEach(r => rooms.push([s, r])));
  const roomRow = ([s, r]) => {
    const occ = A.resas.find(x => x.siteId === s.id && x.room === r && x.from <= t && addDays(x.from, x.nights) > t);
    const a = arr.find(x => x.siteId === s.id && x.room === r), d = dep.find(x => x.siteId === s.id && x.room === r);
    const prep = ts.find(x => x.siteId === s.id && x.room === r && x.pole === 'menage');
    const det = [d ? 'Départ ' + d.guest : '', a ? 'Arrivée ' + a.guest : '', !a && occ ? 'Occupée par ' + occ.guest : ''].filter(Boolean).join(', ') || 'Libre';
    const pill = prep ? (prep.status === 'done' ? '<span class="pill ok">Prête</span>' : '<span class="pill todo">À préparer</span>') : occ ? '<span class="pill busy">Occupée</span>' : '<span class="pill free">Libre</span>';
    return `<div class="row"><span><b>${esc(r)}</b>${A.sites.length > 1 ? ' <span class="hint">' + esc(s.name) + '</span>' : ''}<br><span class="hint">${esc(det)}</span></span>${pill}</div>`;
  };
  const byWho = {}; ts.forEach(x => { (byWho[x.who || ''] = byWho[x.who || ''] || []).push(x); });
  const who = Object.keys(byWho).sort((a,b) => (a === '') - (b === ''));
  return `<header class="head"><div><h1>${dTitle(t)}</h1><p class="sub">${arr.length} arrivée${arr.length > 1 ? 's' : ''} et ${dep.length} départ${dep.length > 1 ? 's' : ''} aujourd’hui.</p></div><div class="actions"><button type="button" class="btn" data-a="newtask">Tâche hors réservation</button><button type="button" class="btn primary" data-a="newresa">Nouvelle réservation</button></div></header>
  <div class="grid">
    <section class="panel"><h2>Qui fait quoi aujourd’hui</h2>${ts.length ? who.map(w => `<div class="whoblk"><b>${w ? esc((personOf(w) || { name:'?' }).name) : 'À attribuer'}</b>${byWho[w].map(x => `<button type="button" class="trow" data-a="task" data-v="${x.id}"><span class="th">${hm(x.start)}</span><i class="tbar" style="background:${poleOf(x.pole).color}"></i><span class="tm"><b>${esc(x.title)}</b><span class="hint">${esc(poleOf(x.pole).name)}${x.extra && x.extra.length ? ', ' + esc(x.extra.join(', ')) : ''}</span></span>${x.status === 'done' ? '<span class="pill ok">Faite</span>' : ''}</button>`).join('')}</div>`).join('') : '<p class="hint">Aucune tâche aujourd’hui. Elles se créent toutes seules avec les réservations.</p>'}</section>
    <section class="panel"><h2>${esc(A.E.unitP || 'Chambres')}</h2>${rooms.map(roomRow).join('')}</section>
    ${(() => { const un = A.tasks.filter(x => !x.who && x.status !== 'done' && x.day >= t && x.day <= addDays(t, 7)).sort((a,b) => a.day < b.day ? -1 : a.day > b.day ? 1 : a.start - b.start);
      const inc = A.incidents.filter(x => x.status === 'open').sort((a,b) => (b.urgent ? 1 : 0) - (a.urgent ? 1 : 0) || (a.day < b.day ? 1 : -1));
      return (inc.length ? `<section class="panel"><h2>Problèmes signalés</h2>${inc.map(x => `<div class="row"><span><b>${x.urgent ? '<span style="color:var(--danger)">Urgent · </span>' : ''}${esc(x.text)}</b><br><span class="hint">${esc(x.byName || '')}${x.room ? ', ' + esc(x.room) : ''}, ${dLabel(x.day)}</span></span><button type="button" class="btn small" data-a="incok" data-v="${x.id}">Réglé</button></div>`).join('')}</section>` : '') + `<section class="panel"><h2>À traiter</h2>${un.length ? `<p class="hint" style="margin:-6px 0 6px">${un.length} tâche${un.length > 1 ? 's' : ''} sans personne dans les 7 prochains jours.</p>` + un.map(x => `<button type="button" class="trow" data-a="task" data-v="${x.id}"><span class="th">${x.day === t ? hm(x.start) : dLabel(x.day).split(' ').slice(0,2).join(' ')}</span><i class="tbar" style="background:${poleOf(x.pole).color}"></i><span class="tm"><b>${esc(x.title)}</b><span class="hint">${esc(poleOf(x.pole).name)}${x.day !== t ? ', ' + hm(x.start) : ''}</span></span><span class="pill todo">Attribuer</span></button>`).join('') : '<p class="hint">Tout est attribué. Rien à traiter.</p>'}</section>`; })()}
  </div>`;
}

/* ---------- réservations ---------- */
function vResas(){
  const q = A.q.toLowerCase().trim();
  const match = r => !q || (r.guest + ' ' + r.room + ' ' + (r.phone || '') + ' ' + r.src).toLowerCase().includes(q);
  const list = A.resas.filter(match).sort((a,b) => a.from < b.from ? -1 : 1);
  const tabs = `<div class="seg"><button type="button" data-a="rmode" data-v="cal" aria-pressed="${A.rmode==='cal'}">Calendrier des ${esc((A.E.unitP || 'chambres').toLowerCase())}</button><button type="button" data-a="rmode" data-v="list" aria-pressed="${A.rmode==='list'}">Liste</button></div>`;
  const top = `<header class="head"><div><h1>Réservations</h1><p class="sub">${A.resas.length} réservation${A.resas.length > 1 ? 's' : ''}. Chaque réservation crée toute seule les tâches des pôles choisis.</p></div><div class="actions"><button type="button" class="btn primary" data-a="newresa">Nouvelle réservation</button></div></header>
    <div class="tools"><input type="search" class="search" id="rq" placeholder="Rechercher un client, une chambre, un téléphone…" value="${esc(A.q)}" aria-label="Rechercher">${tabs}</div>`;
  if (A.rmode === 'list') {
    return top + `<section class="panel" style="overflow-x:auto">${list.length ? `<table><thead><tr><th>Client</th><th>${esc(A.E.unitS || 'Chambre')}</th><th>Arrivée</th><th>Départ</th><th>Origine</th><th></th></tr></thead><tbody>${list.map(r => `<tr><td><b>${esc(r.guest)}</b><br><span class="hint">${r.pers} pers.</span></td><td>${esc(r.room)}${A.sites.length > 1 ? '<br><span class="hint">' + esc(siteOf(r.siteId).name) + '</span>' : ''}</td><td>${dLabel(r.from)}</td><td>${dLabel(addDays(r.from, r.nights))}</td><td><span class="src"><i style="background:${SRC[r.src] || SRC.Autre}"></i>${esc(r.src)}</span></td><td class="num"><button type="button" class="link" data-a="resa" data-v="${r.id}">Ouvrir</button></td></tr>`).join('')}</tbody></table>` : '<p class="hint">Aucune réservation pour l’instant.</p>'}</section>`;
  }
  const start = addDays(todayISO(), -2 + 7 * (A.week || 0)), n = 14;
  let h = `<div class="plan"><div></div>`;
  for (let i = 0; i < n; i++) { const d = addDays(start, i), dt = parse(d); h += `<div class="dh${d === todayISO() ? ' tod' : ''}">${d === todayISO() ? 'auj.' : DAYS[dt.getDay()]}<b>${dt.getDate()}</b></div>`; }
  let row = 2;
  A.sites.forEach(s => s.rooms.forEach(r => {
    h += `<div class="rn" style="grid-row:${row}">${esc(r)}${A.sites.length > 1 ? '<small>' + esc(s.name) + '</small>' : ''}</div>`;
    for (let i = 0; i < n; i++) { const d = addDays(start, i), wd = parse(d).getDay(); h += `<button type="button" class="cell${wd === 0 || wd === 6 ? ' we' : ''}${d === todayISO() ? ' tod' : ''}" style="grid-row:${row};grid-column:${i + 2}" data-a="cellnew" data-site="${s.id}" data-room="${esc(r)}" data-day="${d}" aria-label="Réserver ${esc(r)} le ${dLabel(d)}"></button>`; }
    A.resas.filter(x => x.siteId === s.id && x.room === r && match(x)).forEach(x => {
      let a = diffDays(start, x.from), b = a + x.nights; if (b <= 0 || a >= n) return; a = Math.max(a, 0); b = Math.min(b, n);
      h += `<button type="button" class="resa" data-a="resa" data-v="${x.id}" style="grid-row:${row};grid-column:${a + 2} / ${b + 2};background:${SRC[x.src] || SRC.Autre}">${esc(x.guest)}</button>`;
    });
    row++;
  }));
  h += '</div>';
  return top + `<section class="panel"><div class="phead"><div class="weeknav"><button type="button" class="btn small" data-a="week" data-v="-1" aria-label="Semaine précédente">‹</button><h2 style="margin:0">Du ${dLabel(start)} au ${dLabel(addDays(start, n - 1))}</h2><button type="button" class="btn small" data-a="week" data-v="1" aria-label="Semaine suivante">›</button></div><div class="legend">${Object.entries(SRC).map(([k,c]) => `<span><i style="background:${c}"></i>${k === 'Direct' ? 'Réservation directe' : k}</span>`).join('')}</div></div><p class="hint" style="margin:0 0 10px">Cliquez sur une case vide pour réserver, ou sur une réservation pour l’ouvrir.</p><div class="planwrap">${h}</div></section>`;
}

/* ---------- formulaire de réservation ---------- */
function staffOpts(poleId, sel){
  const anyIn = A.team.some(m => (m.poles || []).includes(poleId));
  return '<option value="">Personne pour l’instant</option>' + A.team.filter(m => !anyIn || (m.poles || []).includes(poleId) || m.role === 'proprio').map(m => `<option value="${m.id}"${m.id === sel ? ' selected' : ''}>${esc(m.name)}</option>`).join('');
}
function resaForm(pre){
  pre = pre || {};
  const r = pre.id ? A.resas.find(x => x.id === pre.id) : null;
  const siteId = r ? r.siteId : (pre.siteId || A.sites[0].id);
  const site = siteOf(siteId);
  const poles = r ? (r.poles || {}) : Object.fromEntries(A.poles.filter(p => ['menage','accueil'].includes(p.id)).map(p => [p.id, (A.team.find(m => m.role !== 'proprio' && (m.poles || []).includes(p.id)) || {}).id || '']));
  const opts = (r && r.opts) || [];
  const from = r ? r.from : (pre.day || todayISO());
  const optHtml = A.poles.map(p => { const os = (A.E.options || []).filter(o => o.pole === p.id); if (!os.length) return ''; return `<div class="optgrp" data-pg="${p.id}" ${p.id in poles ? '' : 'hidden'}><span class="optp"><i style="background:${p.color}"></i>${esc(p.name)}</span><div class="chips">${os.map(o => `<label class="ochip"><input type="checkbox" name="opts" value="${esc(o.label)}"${opts.includes(o.label) ? ' checked' : ''}>${esc(o.label)}</label>`).join('')}</div></div>`; }).join('');
  modal(`<h2>${r ? 'Modifier la réservation' : 'Nouvelle réservation'}</h2>
  <form id="rform" class="fgrid">
    <label class="field">Site<select name="siteId" id="rsite">${A.sites.map(s => `<option value="${s.id}"${s.id === siteId ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
    <label class="field">${esc(A.E.unitS || 'Chambre')}<select name="room" id="rroom">${site.rooms.map(x => `<option${x === (r ? r.room : pre.room) ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select></label>
    <label class="field">Client<input name="guest" required value="${esc(r ? r.guest : '')}" placeholder="Nom du client"></label>
    <label class="field">Personnes<input name="pers" type="number" min="1" max="30" value="${r ? r.pers : 2}"></label>
    <label class="field">Arrivée<input name="from" type="date" required value="${from}"></label>
    <label class="field">Nuits<input name="nights" type="number" min="1" max="60" value="${r ? r.nights : 2}"></label>
    <p class="hint full" id="dep"></p>
    <label class="field">Origine<select name="src">${Object.keys(SRC).map(k => `<option${(r ? r.src : 'Direct') === k ? ' selected' : ''}>${k}</option>`).join('')}</select></label>
    <label class="field">Heure d’arrivée prévue<input name="eta" type="time" value="${esc(r && r.eta ? r.eta : '')}"></label>
    <label class="field">Téléphone<input name="phone" type="tel" value="${esc(r && r.phone ? r.phone : '')}"></label>
    <label class="field">Email<input name="email" type="email" value="${esc(r && r.email ? r.email : '')}"></label>
    <fieldset class="full box"><legend>Pôles concernés et qui s’en occupe</legend><p class="hint" style="margin:0 0 8px">Un pôle, c’est un type de travail. Cochez ceux qui servent pour ce séjour : chaque personne ne verra que sa tâche.</p>
      ${A.poles.map(p => `<div class="prow"><label class="ochip"><input type="checkbox" name="pol" value="${p.id}"${p.id in poles ? ' checked' : ''}><i class="sw" style="background:${p.color}"></i>${esc(p.name)}</label><select name="who_${p.id}" class="wsel" ${p.id in poles ? '' : 'disabled'} aria-label="Qui s’occupe de ${esc(p.name)}">${staffOpts(p.id, poles[p.id])}</select><label class="tlab">à<input type="time" name="at_${p.id}" class="tsel" value="${esc(((r && r.times) || {})[p.id] || '')}" ${p.id in poles ? '' : 'disabled'} aria-label="Heure pour ${esc(p.name)}, facultative"></label></div>`).join('')}<p class="hint" style="margin:4px 0 0">L’heure est facultative. Sans heure, Gouverne la calcule toute seule : ménage avant l’arrivée, accueil à l’heure d’arrivée, petit-déjeuner à 8:30 chaque matin.</p></fieldset>
    ${optHtml ? `<fieldset class="full box"><legend>Options</legend>${optHtml}</fieldset>` : ''}
    <label class="field full">Note pour l’équipe, facultative<textarea name="note" placeholder="Allergies, lit bébé, arrivée tardive…">${esc(r && r.note ? r.note : '')}</textarea></label>
    <p class="err full" id="rerr"></p>
    <div class="foot full">${r ? `<button type="button" class="link danger" id="rcancel">Annuler la réservation</button>` : '<span></span>'}<span style="display:flex;gap:10px"><button type="button" class="btn" data-close>Fermer</button><button type="submit" class="btn primary">${r ? 'Enregistrer' : 'Enregistrer la réservation'}</button></span></div>
  </form>`);
  const f = $('#rform');
  const dep = () => { const a = f.from.value, n = Math.max(1, +f.nights.value || 1); $('#dep').textContent = a ? 'Départ le ' + dTitle(addDays(a, n)).toLowerCase() + ', ' + n + ' nuit' + (n > 1 ? 's' : '') + '.' : ''; };
  dep(); f.from.oninput = dep; f.nights.oninput = dep;
  $('#rsite').onchange = () => { $('#rroom').innerHTML = siteOf($('#rsite').value).rooms.map(x => `<option>${esc(x)}</option>`).join(''); };
  f.querySelectorAll('[name=pol]').forEach(cb => cb.onchange = () => { f['who_' + cb.value].disabled = !cb.checked; f['at_' + cb.value].disabled = !cb.checked; const g = f.querySelector(`[data-pg="${cb.value}"]`); if (g) g.hidden = !cb.checked; });
  f.onsubmit = async e => { e.preventDefault(); await saveResa(f, r); };
  if (r) $('#rcancel').onclick = () => cancelResa(r);
}

async function saveResa(f, r){
  const fd = new FormData(f);
  const d = Object.fromEntries(fd);
  const from = d.from, nights = Math.max(1, +d.nights || 1);
  if (!from) return $('#rerr').textContent = 'Indiquez la date d’arrivée.';
  const clash = A.resas.find(x => (!r || x.id !== r.id) && x.siteId === d.siteId && x.room === d.room && x.from < addDays(from, nights) && from < addDays(x.from, x.nights));
  if (clash) return $('#rerr').textContent = `${d.room} est déjà réservée par ${clash.guest} du ${dLabel(clash.from)} au ${dLabel(addDays(clash.from, clash.nights))} : changez de dates ou de chambre.`;
  const poles = {}, times = {}; fd.getAll('pol').forEach(p => { poles[p] = d['who_' + p] || ''; if (d['at_' + p]) times[p] = d['at_' + p]; });
  const opts = fd.getAll('opts').filter(o => { const op = (A.E.options || []).find(x => x.label === o); return op && op.pole in poles; });
  const data = { siteId:d.siteId, room:d.room, guest:d.guest.trim(), pers:Math.max(1, +d.pers || 1), from, nights, src:d.src, eta:d.eta || '', phone:(d.phone || '').trim(), email:(d.email || '').trim(), note:(d.note || '').trim(), poles, times, opts, updatedAt:serverTimestamp() };
  const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Enregistrement…';
  try {
    const b = writeBatch(db);
    const ref = r ? doc(db, 'etablissements', A.eid, 'reservations', r.id) : doc(collection(db, 'etablissements', A.eid, 'reservations'));
    if (r) b.update(ref, data); else b.set(ref, { ...data, createdAt:serverTimestamp(), createdBy:A.user.uid });
    // tâches : on remplace celles qui ne sont pas encore faites
    A.tasks.filter(t => t.resaId === ref.id && t.status !== 'done').forEach(t => b.delete(doc(db, 'etablissements', A.eid, 'taches', t.id)));
    const kept = A.tasks.filter(t => t.resaId === ref.id && t.status === 'done').map(t => t.pole);
    const eta = /^\d{1,2}:\d{2}$/.test(data.eta) ? (+data.eta.split(':')[0] + (+data.eta.split(':')[1]) / 60) : 16;
    const dur = A.E.settings && A.E.settings.durees || {}; const dp = dur.prep == null ? 1.5 : dur.prep, da = dur.accueil == null ? 0.5 : dur.accueil;
    const made = [];
    Object.entries(poles).forEach(([pid, who]) => {
      if (kept.includes(pid)) return;
      const p = poleOf(pid);
      const when = p.when || (pid === 'menage' ? 'avant' : pid === 'accueil' ? 'arrivee' : /d[ée]jeuner|breakfast/i.test(p.name) ? 'matin' : 'arrivee');
      const extra = opts.filter(o => ((A.E.options || []).find(x => x.label === o) || {}).pole === pid);
      const toH = v => /^\d{1,2}:\d{2}$/.test(v || '') ? (+v.split(':')[0] + (+v.split(':')[1]) / 60) : null;
      const fix = toH(times[pid]);
      const add = (day, start, end, title, detail) => b.set(doc(collection(db, 'etablissements', A.eid, 'taches')), { resaId:ref.id, pole:pid, who:who || '', day, start, end, title, detail, extra, siteId:data.siteId, room:data.room, note:data.note, status:'todo', checks:[], createdAt:serverTimestamp() });
      if (when === 'avant') { const st = fix != null ? fix : Math.max(8, eta - dp - 1); add(from, st, st + dp, data.room, 'Préparer pour l’arrivée de ' + data.guest + ' à ' + hm(eta)); }
      else if (when === 'matin') { const at = fix != null ? fix : (p.at == null ? 8.5 : p.at); for (let k = 1; k <= nights; k++) add(addDays(from, k), at, at + 1, p.name + ' : ' + data.guest, data.pers + ' pers., ' + data.room); }
      else if (when === 'soir') { const at = fix != null ? fix : (p.at == null ? 19.5 : p.at); for (let k = 0; k < nights; k++) add(addDays(from, k), at, at + 1.5, p.name + ' : ' + data.guest, data.pers + ' pers., ' + data.room); }
      else if (pid === 'accueil') add(from, fix != null ? fix : eta, (fix != null ? fix : eta) + da, 'Accueil ' + data.guest, data.pers + ' pers., ' + nights + ' nuit' + (nights > 1 ? 's' : ''));
      else { const at = fix != null ? fix : (p.at == null ? eta : p.at); add(from, at, at + 1, p.name + ' : ' + data.guest, 'Séjour du ' + dLabel(from) + ' au ' + dLabel(addDays(from, nights))); }
      made.push(p.name + ' (' + (who ? (personOf(who) || { name:'?' }).name : 'à attribuer') + (fix != null ? ', ' + times[pid] : '') + ')' + (when === 'matin' ? ', chaque matin' : when === 'soir' ? ', chaque soir' : ''));
    });
    await b.commit();
    closeModal();
    toast((r ? 'Réservation modifiée.' : 'Réservation enregistrée.') + (made.length ? ' Tâches : ' + made.join(', ') + '.' : ''));
  } catch (x) { console.error(x); $('#rerr').textContent = msg(x); btn.disabled = false; btn.textContent = 'Réessayer'; }
}

/* ---------- planning d'équipe ---------- */
const H0 = 7, H1 = 23;
function vTasks(){
  const t = todayISO(); const day = A.pday && A.pday >= t ? A.pday : t; A.pday = day;
  const chips = Array.from({ length:14 }, (_, i) => { const d = addDays(t, i), dt = parse(d), n = A.tasks.filter(x => x.day === d).length;
    return `<button type="button" data-a="pday" data-v="${d}" aria-pressed="${d === day}"><small>${i === 0 ? 'auj.' : DAYS[dt.getDay()]}</small><b>${dt.getDate()}</b><i>${n} tâche${n > 1 ? 's' : ''}</i></button>`; }).join('');
  const ts = A.tasks.filter(x => x.day === day).sort((a,b) => a.start - b.start);
  const people = A.team.slice().sort((a,b) => (a.role === 'proprio') - (b.role === 'proprio') || a.name.localeCompare(b.name));
  const rows = people.map(m => ({ id:m.id, name:m.name, sub:(m.poles || []).map(id => poleOf(id).name).join(', '), dp:dispoOf(m.id, day), ts:ts.filter(x => x.who === m.id) }));
  const un = ts.filter(x => !x.who); if (un.length) rows.push({ id:'', name:'À attribuer', sub:'', ts:un, un:true });
  const col = h => Math.round((Math.max(H0, Math.min(H1, h)) - H0) * 2) + 2;
  let hours = '<div class="tlh">'; for (let h = H0 + 1; h < H1; h += 2) hours += `<span style="grid-row:1;grid-column:${col(h)} / span 4">${h} h</span>`; hours += '</div>';
  const now = new Date(), nowH = now.getHours() + now.getMinutes() / 60;
  const frise = `<div class="tlwrap"><div class="tl">${hours}${rows.map((r, ri) => `<div class="tlr${r.un ? ' un' : ''}${ri % 2 ? ' alt' : ''}"><i class="tlbg" style="grid-row:${ri + 2}"></i><div class="tlw" style="grid-row:${ri + 2}"><b>${esc(r.name)}</b><small>${esc(r.sub)}</small>${r.dp ? `<small class="dtag${r.dp.kind === 'indispo' ? ' indispo' : ''}">${esc(dispoTxt(r.dp))}</small>` : ''}</div>${day === t && nowH > H0 && nowH < H1 ? `<i class="tlnow" style="grid-row:${ri + 2};grid-column:${col(nowH)}"></i>` : ''}${r.ts.map(x => { const p = poleOf(x.pole); return `<button type="button" class="blk${x.status === 'done' ? ' done' : ''}" data-a="task" data-v="${x.id}" title="${esc(x.title + ', ' + hm(x.start) + ' à ' + hm(x.end))}" style="grid-row:${ri + 2};grid-column:${col(x.start)} / ${Math.max(col(x.end), col(x.start) + 1)};${x.status === 'done' ? '' : 'background:' + p.color + ';color:' + (p.fg || '#fff')}"><small>${x.status === 'done' ? '✓ ' : ''}${hm(x.start)}</small>${esc(x.title)}</button>`; }).join('')}</div>`).join('')}</div></div>`;
  const list = ts.length ? ts.map(x => `<button type="button" class="trow" data-a="task" data-v="${x.id}"><span class="th">${hm(x.start)}</span><i class="tbar" style="background:${poleOf(x.pole).color}"></i><span class="tm"><b>${esc(x.title)}</b><span class="hint">${esc(poleOf(x.pole).name)}, ${x.who ? esc((personOf(x.who) || { name:'?' }).name) : 'à attribuer'}</span></span>${x.status === 'done' ? '<span class="pill ok">Faite</span>' : !x.who ? '<span class="pill todo">Attribuer</span>' : ''}</button>`).join('') : '<p class="hint">Aucune tâche ce jour-là.</p>';
  return `<header class="head"><div><h1>Planning d’équipe</h1><p class="sub">Qui fait quoi, jour par jour, sur les deux semaines à venir.</p></div><div class="actions"><button type="button" class="btn primary" data-a="newtask">Tâche hors réservation</button></div></header>
    <div class="dchips">${chips}</div>
    <section class="panel"><div class="phead"><h2 style="margin:0">${dTitle(day)}</h2><span class="hint">Touchez une tâche pour la donner à quelqu’un, changer l’heure ou la marquer faite.</span></div>
      <div class="onlydesk">${ts.length ? frise : '<p class="hint">Aucune tâche ce jour-là.</p>'}</div><div class="onlymob">${list}</div></section>`;
}
