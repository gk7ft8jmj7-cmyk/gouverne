/* ---------- dispos (travail, repos, congés, indispo) ---------- */
const DK = { travail:'Travail', repos:'Repos', conges:'Congés', indispo:'Indispo' };
const ROLE = { proprio:'Propriétaire', gerant:'Gérant', collab:'Collaborateur' };
const dispoOf = (pid, day) => A.dispos.find(x => x.pid === pid && x.day === day);
const dispoTxt = d => !d ? '' : d.kind === 'indispo' && d.from != null ? 'Indispo ' + hm(d.from) + '–' + hm(d.to) : DK[d.kind] || '';
function blocked(pid, day, s, e){
  const d = day && dispoOf(pid, day); if (!d) return '';
  if (d.kind === 'repos' || d.kind === 'conges') return DK[d.kind].toLowerCase();
  if (d.kind === 'indispo') { if (d.from == null) return 'indispo'; if (s == null || (s < d.to && e > d.from)) return 'indispo ' + hm(d.from) + '–' + hm(d.to); }
  return '';
}
const mondayOf = s => addDays(s, -((parse(s).getDay() + 6) % 7));
function dispoEdit(pid, day){
  const m = personOf(pid); if (!m) return;
  const d = dispoOf(pid, day), ges = A.role !== 'collab';
  const mine = d && d.kind === 'indispo';
  const cur = d ? (d.kind === 'indispo' ? (d.from != null ? 'plage' : 'indispo') : d.kind) : (ges ? 'travail' : 'indispo');
  const kinds = ges ? [['travail','Travail'],['repos','Repos'],['conges','Congés'],['indispo','Indispo toute la journée'],['plage','Indispo sur une plage']] : [['indispo','Indispo toute la journée'],['plage','Indispo sur une plage']];
  const l = modal(`<h2>${ges ? esc(m.name) + ', ' : ''}${dTitle(day)}</h2>
    ${!ges && d && !mine ? `<p style="margin:0;color:var(--muted)">Prévu par la gérance : <b>${esc(DK[d.kind])}</b>. Vous pouvez signaler une indisponibilité.</p>` : ''}
    <form id="dform" class="fgrid">
      <div class="kopts full">${kinds.map(k => `<label class="kopt${k[0] === 'indispo' || k[0] === 'plage' ? ' bx' : ''}"><input type="radio" name="k" value="${k[0]}"${cur === k[0] ? ' checked' : ''}>${k[1]}</label>`).join('')}</div>
      <label class="field" data-pl>De<input type="time" name="from" value="${d && d.from != null ? toHHMM(d.from) : '14:00'}"></label>
      <label class="field" data-pl>À<input type="time" name="to" value="${d && d.to != null ? toHHMM(d.to) : '18:00'}"></label>
      <p class="hint full" data-pl style="margin:0">Seule cette plage est bloquée, le reste de la journée reste disponible.</p>
      <p class="err full" id="derr"></p>
      <div class="foot full">${d && (ges || mine) ? '<button type="button" class="link danger" id="ddel">Effacer</button>' : '<span></span>'}<span style="display:flex;gap:10px"><button type="button" class="btn" data-close>Fermer</button><button type="submit" class="btn primary">Enregistrer</button></span></div>
    </form>`);
  const f = l.querySelector('#dform'), ref = doc(db, 'etablissements', A.eid, 'dispos', pid + '_' + day);
  const sync = () => { const p = f.elements.k.value === 'plage'; l.querySelectorAll('[data-pl]').forEach(x => x.hidden = !p); };
  f.querySelectorAll('[name=k]').forEach(r => r.onchange = sync); sync();
  f.onsubmit = async e => { e.preventDefault(); const k = f.elements.k.value; let from = null, to = null;
    if (k === 'plage') { from = toH(f.elements.from.value); to = toH(f.elements.to.value); if (from == null || to == null || to <= from) { $('#derr').textContent = 'L’heure de fin doit être après l’heure de début.'; return; } }
    try { await setDoc(ref, { pid, day, kind: k === 'plage' ? 'indispo' : k, from, to, by: A.pid || '', updatedAt: serverTimestamp() }); closeModal(); toast('Enregistré.'); }
    catch (x) { $('#derr').textContent = msg(x); } };
  const del = l.querySelector('#ddel'); if (del) del.onclick = async () => { try { await deleteDoc(ref); closeModal(); toast('Effacé.'); } catch (x) { $('#derr').textContent = msg(x); } };
}

/* ---------- équipe (gérance) ---------- */
function vTeam(){
  const t = todayISO(), start = addDays(mondayOf(t), (A.tweek || 0) * 7), days = Array.from({ length:7 }, (_, i) => addDays(start, i));
  const people = A.team.slice().sort((a,b) => (b.role === 'proprio') - (a.role === 'proprio') || a.name.localeCompare(b.name));
  const status = m => m.role === 'proprio' ? '' : m.uid ? '<span class="pill ok">Compte actif</span>' : m.inviteCode ? '<span class="pill todo">Invitation envoyée</span>' : '<span class="pill free">À inviter</span>';
  const cards = people.map(m => `<div class="tcard"><span><b>${esc(m.name)}</b><span class="hint">${ROLE[m.role] || 'Collaborateur'}${(m.poles || []).length ? ', ' + esc(m.poles.map(id => poleOf(id).name).join(', ')) : ''}${A.sites.length > 1 && (m.sites || []).length ? ' · ' + esc(m.sites.map(id => siteOf(id).name).join(', ')) : ''}</span></span>
    <span class="tcact">${status(m)}${m.role !== 'proprio' && !m.uid ? `<button type="button" class="btn small" data-a="pinv" data-v="${m.id}">${m.inviteCode ? 'Voir le lien' : 'Inviter'}</button>` : ''}<button type="button" class="btn small" data-a="pedit" data-v="${m.id}">Modifier</button></span></div>`).join('');
  const head = `<div></div>` + days.map(d => { const dt = parse(d); return `<div class="dh${d === t ? ' tod' : ''}">${DAYS[dt.getDay()]}<b>${dt.getDate()} ${MONTHS[dt.getMonth()]}</b></div>`; }).join('');
  const rows = people.map(m => `<div class="rn">${esc(m.name)}<small>${ROLE[m.role] || ''}</small></div>` + days.map(d => { const x = dispoOf(m.id, d), n = A.tasks.filter(k => k.who === m.id && k.day === d).length;
    return `<button type="button" class="dc${x ? ' k-' + x.kind : ''}" data-a="dcell" data-p="${m.id}" data-d="${d}" aria-label="${esc(m.name)}, ${dLabel(d)}">${x ? esc(dispoTxt(x)) : '<span style="color:var(--faint);font-weight:400">—</span>'}${n ? `<small>${n} tâche${n > 1 ? 's' : ''}</small>` : ''}</button>`; }).join('')).join('');
  return `<header class="head"><div><h1>Équipe</h1><p class="sub">Les fiches, les accès et la semaine de chacun.</p></div><div class="actions"><button type="button" class="btn primary" data-a="padd">Ajouter une personne</button></div></header>
    <section class="panel"><h2>Fiches</h2>${cards}</section>
    <section class="panel"><div class="phead"><div class="weeknav"><button type="button" class="btn small" data-a="tweek" data-v="-1" aria-label="Semaine précédente">‹</button><h2 style="margin:0">Semaine du ${dLabel(start)}</h2><button type="button" class="btn small" data-a="tweek" data-v="1" aria-label="Semaine suivante">›</button></div>
      <div class="legend"><span><i style="background:#2C5A3C"></i>Travail</span><span><i style="background:#8E939A"></i>Repos</span><span><i style="background:#7A6638"></i>Congés</span><span><i style="background:var(--danger)"></i>Indispo</span></div></div>
      <p class="hint" style="margin:0 0 10px">Touchez une case pour indiquer travail, repos, congés ou une indisponibilité (journée ou plage horaire).</p>
      <div class="wkwrap"><div class="wk">${head}${rows}</div></div></section>`;
}

function personForm(id){
  const m = id ? personOf(id) : null, own = m && m.role === 'proprio';
  const ps = m ? m.poles || [] : [], ss = m ? m.sites || [] : A.sites.map(s => s.id);
  const l = modal(`<h2>${m ? esc(m.name) : 'Nouvelle personne'}</h2>
    <form id="pform" class="fgrid">
      <label class="field">Prénom<input name="name" required value="${m ? esc(m.name) : ''}" autocomplete="off"></label>
      ${own ? '<div class="field">Rôle<span style="font-weight:600;color:var(--ink);padding-top:10px">Propriétaire</span></div>' : `<label class="field">Rôle<select name="role"><option value="collab"${!m || m.role === 'collab' ? ' selected' : ''}>Collaborateur : voit ses tâches</option><option value="gerant"${m && m.role === 'gerant' ? ' selected' : ''}>Gérant : gère tout l’établissement</option></select></label>`}
      <div class="field full">Pôles<div class="chips">${A.poles.map(p => `<label class="ochip" style="min-width:0"><input type="checkbox" name="poles" value="${p.id}"${ps.includes(p.id) ? ' checked' : ''}>${esc(p.name)}</label>`).join('')}</div></div>
      ${A.sites.length > 1 ? `<div class="field full">Sites<div class="chips">${A.sites.map(s => `<label class="ochip" style="min-width:0"><input type="checkbox" name="sites" value="${s.id}"${ss.includes(s.id) ? ' checked' : ''}>${esc(s.name)}</label>`).join('')}</div></div>` : ''}
      <p class="err full" id="perr"></p>
      <div class="foot full">${m && !own && m.id !== A.pid ? '<button type="button" class="link danger" id="pdel">Retirer de l’équipe</button>' : '<span></span>'}<span style="display:flex;gap:10px"><button type="button" class="btn" data-close>Fermer</button><button type="submit" class="btn primary">${m ? 'Enregistrer' : 'Ajouter'}</button></span></div>
    </form>`);
  const f = l.querySelector('#pform');
  f.onsubmit = async e => { e.preventDefault(); const fd = new FormData(f);
    const data = { name: fd.get('name').trim(), poles: fd.getAll('poles'), sites: A.sites.length > 1 ? fd.getAll('sites') : A.sites.map(s => s.id) };
    if (!data.name) return; if (!data.poles.length) { $('#perr').textContent = 'Choisissez au moins un pôle.'; return; }
    if (!own) data.role = fd.get('role');
    try { const b = writeBatch(db);
      if (!m) b.set(doc(collection(db, 'etablissements', A.eid, 'equipe')), { ...data, uid:null, access:'a_inviter', createdAt: serverTimestamp() });
      else { b.update(doc(db, 'etablissements', A.eid, 'equipe', m.id), data);
        if (!own && data.role !== m.role) { if (m.uid) b.update(doc(db, 'etablissements', A.eid, 'membres', m.uid), { role: data.role }); if (m.inviteCode && !m.uid) b.update(doc(db, 'invitations', m.inviteCode), { role: data.role, name: data.name }); } }
      await b.commit(); closeModal(); toast(m ? 'Fiche enregistrée.' : data.name + ' ajouté(e). Envoyez-lui son lien d’invitation.'); }
    catch (x) { $('#perr').textContent = msg(x); } };
  const del = l.querySelector('#pdel'); if (del) del.onclick = () => { closeModal(); const n = A.tasks.filter(t => t.who === m.id && t.status !== 'done').length;
    const c = modal(`<h2>Retirer ${esc(m.name)} ?</h2><p style="margin:0">${m.uid ? 'Son accès à Gouverne sera coupé. ' : ''}${n ? n + ' tâche' + (n > 1 ? 's' : '') + ' à faire repasse' + (n > 1 ? 'nt' : '') + ' en « À attribuer ».' : ''}</p><div class="foot"><button type="button" class="btn" data-close>Non, garder</button><button type="button" class="btn danger" id="pdok">Oui, retirer</button></div>`);
    c.querySelector('#pdok').onclick = async () => { try { const b = writeBatch(db);
      A.tasks.filter(t => t.who === m.id && t.status !== 'done').forEach(t => b.update(doc(db, 'etablissements', A.eid, 'taches', t.id), { who:'' }));
      if (m.uid) b.delete(doc(db, 'etablissements', A.eid, 'membres', m.uid));
      if (m.inviteCode && !m.uid) b.delete(doc(db, 'invitations', m.inviteCode));
      b.delete(doc(db, 'etablissements', A.eid, 'equipe', m.id));
      await b.commit(); closeModal(); toast(m.name + ' a été retiré(e) de l’équipe.'); } catch (x) { toast(msg(x)); } }; };
}

/* ---------- invitations ---------- */
function randCode(){ const a = crypto.getRandomValues(new Uint8Array(24)); return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
async function invite(pid, renew){
  const m = personOf(pid); if (!m) return;
  let code = m.inviteCode;
  try {
    if (!code || renew) { const b = writeBatch(db);
      if (code) b.delete(doc(db, 'invitations', code));
      code = randCode();
      b.set(doc(db, 'invitations', code), { eid:A.eid, etabName:A.E.name, personId:pid, name:m.name, role: m.role === 'gerant' ? 'gerant' : 'collab', used:false, createdBy:A.user.uid, createdAt: serverTimestamp() });
      b.update(doc(db, 'etablissements', A.eid, 'equipe', pid), { inviteCode:code, access:'invite' });
      await b.commit(); }
  } catch (x) { toast(msg(x)); return; }
  const url = location.origin + location.pathname + '?invite=' + code;
  const txt = 'Bonjour ' + m.name + ', voici ton accès à Gouverne pour ' + A.E.name + ' : ' + url;
  closeModal();
  const l = modal(`<h2>Invitation de ${esc(m.name)}</h2><p style="margin:0;color:var(--muted)">Envoyez ce lien à ${esc(m.name)} seulement. En l’ouvrant, ${esc(m.name)} crée son compte et retrouve directement ses tâches. Le lien ne sert qu’une fois.</p>
    <div class="linkbox"><input readonly value="${esc(url)}" id="ilink" aria-label="Lien d’invitation"><button type="button" class="btn primary" id="icopy">Copier</button></div>
    <div class="actions">${navigator.share ? '<button type="button" class="btn" id="ishare">Partager</button>' : ''}<a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="sms:?&body=${encodeURIComponent(txt)}">Par SMS</a><a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="mailto:?subject=${encodeURIComponent('Votre accès Gouverne')}&body=${encodeURIComponent(txt)}">Par email</a></div>
    <div class="foot"><button type="button" class="link danger" id="irenew">Créer un nouveau lien</button><button type="button" class="btn" data-close>Fermer</button></div>`);
  l.querySelector('#icopy').onclick = async () => { try { await navigator.clipboard.writeText(url); toast('Lien copié.'); } catch (_) { const i = $('#ilink'); i.select(); document.execCommand('copy'); toast('Lien copié.'); } };
  const sh = l.querySelector('#ishare'); if (sh) sh.onclick = () => navigator.share({ title:'Gouverne', text:txt }).catch(() => {});
  l.querySelector('#irenew').onclick = () => invite(pid, true);
}

/* ---------- appli des employés ---------- */
const me = () => personOf(A.pid) || { name:'' };
function tRow(x){ const p = poleOf(x.pole), d = x.status === 'done', n = (p.checks || []).length, c = d ? n : (x.checks || []).length;
  return `<button type="button" class="scard${d ? ' done' : ''}" data-a="stask" data-v="${x.id}" style="border-left-color:${p.color}"><span class="th">${hm(x.start)}</span><span class="tm"><b>${esc(x.title)}</b><span class="hint">${esc(p.name)}${x.room ? ', ' + esc(x.room) : ''}${x.extra && x.extra.length ? ', ' + esc(x.extra.join(', ')) : ''}</span>${n ? `<span class="prog">${c}/${n} points vérifiés</span>` : ''}</span><span class="go">${d ? '✓ Faite' : 'Faire ›'}</span></button>`; }
function vMine(){
  const t = todayISO(), days = Array.from({ length:14 }, (_, i) => addDays(t, i));
  const mine = A.tasks.filter(x => x.day >= t && x.day <= days[13]).sort((a,b) => a.day < b.day ? -1 : a.day > b.day ? 1 : a.start - b.start);
  const mode = A.smode || 'list', day = A.pday && A.pday >= t && A.pday <= days[13] ? A.pday : t; A.pday = day;
  const nt = mine.filter(x => x.day === t && x.status !== 'done').length;
  const seg = `<div class="seg">${[['list','Liste'],['agenda','Agenda'],['bulles','Bulles']].map(m => `<button type="button" data-a="smode" data-v="${m[0]}" aria-pressed="${mode === m[0]}">${m[1]}</button>`).join('')}</div>`;
  let body = '';
  if (mode === 'list') {
    body = days.filter(d => mine.some(x => x.day === d) || dispoOf(A.pid, d)).map(d => { const x = dispoOf(A.pid, d), ts = mine.filter(k => k.day === d);
      return `<h3 class="dayh">${d === t ? 'Aujourd’hui' : dTitle(d)}${x ? ` <span class="dtag${x.kind === 'indispo' ? ' indispo' : ''}">· ${esc(dispoTxt(x))}</span>` : ''}</h3>${ts.map(tRow).join('') || '<p class="hint" style="margin:4px 0">Aucune tâche.</p>'}`; }).join('') || '<p class="hint">Aucune tâche sur les deux prochaines semaines.</p>';
    body = `<p class="hint" style="margin:0">Touchez une tâche pour l’ouvrir, cocher les points et la valider.</p><section class="panel">${body}</section>`;
  } else if (mode === 'agenda') {
    const chips = days.map((d, i) => { const dt = parse(d), n = mine.filter(x => x.day === d).length, x = dispoOf(A.pid, d);
      return `<button type="button" data-a="pday" data-v="${d}" aria-pressed="${d === day}"${x && x.kind === 'indispo' && d !== day ? ' style="border-color:var(--danger)"' : ''}><small>${i === 0 ? 'auj.' : DAYS[dt.getDay()]}</small><b>${dt.getDate()}</b><i>${n} tâche${n > 1 ? 's' : ''}</i></button>`; }).join('');
    const ts = mine.filter(x => x.day === day), row = h => Math.round((Math.max(H0, Math.min(H1, h)) - H0) * 2) + 1;
    let g = ''; for (let h = H0; h < H1; h++) g += `<div class="agh" style="grid-row:${row(h)} / span 2">${h} h</div><div class="agl" style="grid-row:${row(h)} / span 2"></div>`;
    const x = dispoOf(A.pid, day);
    if (x && x.kind === 'indispo') g += `<div class="agx" style="grid-row:${x.from != null ? row(x.from) + ' / ' + Math.max(row(x.to), row(x.from) + 1) : '1 / ' + row(H1)}">${esc(dispoTxt(x))}</div>`;
    g += ts.map(k => { const p = poleOf(k.pole); return `<button type="button" class="agb${k.status === 'done' ? ' done' : ''}" data-a="stask" data-v="${k.id}" style="grid-row:${row(k.start)} / ${Math.max(row(k.end), row(k.start) + 1)};background:${p.color};color:${p.fg || '#fff'}">${k.status === 'done' ? '✓ ' : ''}${hm(k.start)} ${esc(k.title)}</button>`; }).join('');
    body = `<div class="dchips">${chips}</div><section class="panel"><div class="phead"><h2 style="margin:0">${dTitle(day)}</h2>${x ? `<span class="dtag${x.kind === 'indispo' ? ' indispo' : ''}">${esc(dispoTxt(x))}</span>` : ''}</div><div class="ag">${g}</div></section>`;
  } else {
    body = `<section class="panel"><p class="hint" style="margin:0 0 12px">Touchez un jour pour voir son agenda.</p><div class="bul">${days.map((d, i) => { const dt = parse(d), ts = mine.filter(k => k.day === d), x = dispoOf(A.pid, d), poles = [...new Set(ts.map(k => k.pole))];
      return `<button type="button" class="bub${d === t ? ' tod' : ''}${x ? ' k-' + x.kind : ''}" data-a="sday" data-v="${d}"><small>${i === 0 ? 'auj.' : DAYS[dt.getDay()]}</small><b>${dt.getDate()}</b><small>${ts.length ? ts.length + ' tâche' + (ts.length > 1 ? 's' : '') : x ? esc(DK[x.kind]) : '—'}</small><span class="dots">${poles.map(p => `<i style="background:${poleOf(p).color}"></i>`).join('')}</span></button>`; }).join('')}</div></section>`;
  }
  return `<header class="head"><div><h1>Bonjour ${esc(me().name)}</h1><p class="sub">${nt ? nt + ' tâche' + (nt > 1 ? 's' : '') + ' à faire aujourd’hui.' : 'Rien à faire aujourd’hui.'}</p></div><div class="actions"><button type="button" class="btn" data-a="report">Signaler un problème</button></div></header><div class="tools">${seg}</div>${body}`;
}

function staffTask(id){
  const t = A.tasks.find(x => x.id === id); if (!t) return;
  const p = poleOf(t.pole), done = t.status === 'done', got = t.checks || [];
  const l = modal(`<h2>${esc(t.title)}</h2><p style="margin:0;color:var(--muted)">${esc(p.name)}, ${dTitle(t.day)}, ${hm(t.start)} à ${hm(t.end)}${t.room ? '. ' + esc(t.room) : ''}${A.sites.length > 1 && t.siteId ? ', ' + esc(siteOf(t.siteId).name) : ''}.</p>
    ${t.extra && t.extra.length ? `<div><b style="font-size:14px">Options</b><div class="chips" style="margin-top:6px">${t.extra.map(o => `<span class="chip">${esc(o)}</span>`).join('')}</div></div>` : ''}
    ${t.note ? `<div class="note"><b>Note</b>${esc(t.note)}</div>` : ''}
    ${(p.checks || []).length ? `<div class="chks">${p.checks.map((c, i) => `<label class="chk"><input type="checkbox" data-c="${i}"${got.includes(c) || done ? ' checked' : ''}${done ? ' disabled' : ''}>${esc(c)}</label>`).join('')}</div>` : ''}
    <p class="err" id="serr"></p>
    <div class="foot"><button type="button" class="link" id="srep">Signaler un problème</button><span style="display:flex;gap:10px">${done ? '<button type="button" class="btn" id="sundo">Annuler la validation</button>' : '<button type="button" class="btn primary" id="sok">Valider</button>'}</span></div>`);
  const ref = doc(db, 'etablissements', A.eid, 'taches', id);
  l.querySelector('#srep').onclick = () => { closeModal(); report(t); };
  const ok = l.querySelector('#sok'); if (ok) ok.onclick = async () => {
    const checks = [...l.querySelectorAll('[data-c]')].filter(i => i.checked).map(i => p.checks[+i.dataset.c]);
    if (checks.length < (p.checks || []).length && !ok.dataset.force) { $('#serr').textContent = 'Il reste des points non cochés. Touchez encore « Valider » pour valider quand même.'; ok.dataset.force = 1; return; }
    try { await updateDoc(ref, { status:'done', checks, endedAt: serverTimestamp() }); closeModal(); toast('Tâche validée. Merci !'); } catch (x) { $('#serr').textContent = msg(x); } };
  const un = l.querySelector('#sundo'); if (un) un.onclick = async () => { try { await updateDoc(ref, { status:'todo' }); closeModal(); toast('Tâche remise à faire.'); } catch (x) { $('#serr').textContent = msg(x); } };
}

function report(t){
  const l = modal(`<h2>Signaler un problème</h2><p style="margin:0;color:var(--muted)">La gérance le verra tout de suite sur son tableau de bord.</p>
    <form id="iform" class="fgrid">
      <label class="field full">Où, facultatif<select name="room"><option value="">Pas d’endroit précis</option>${A.sites.map(s => s.rooms.map(r => `<option value="${s.id}|${esc(r)}"${t && t.siteId === s.id && t.room === r ? ' selected' : ''}>${esc(r)}${A.sites.length > 1 ? ' (' + esc(s.name) + ')' : ''}</option>`).join('')).join('')}</select></label>
      <label class="field full">Le problème<textarea name="text" required placeholder="Par exemple : la chasse d’eau fuit, il manque des serviettes…"></textarea></label>
      <label class="field full" style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" name="urgent" style="width:18px;height:18px;accent-color:var(--danger)">C’est urgent</label>
      <p class="err full" id="ierr"></p>
      <div class="foot full"><span></span><span style="display:flex;gap:10px"><button type="button" class="btn" data-close>Fermer</button><button type="submit" class="btn primary">Envoyer</button></span></div>
    </form>`);
  l.querySelector('#iform').onsubmit = async e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target)); const [sid, room] = d.room ? d.room.split('|') : ['', ''];
    if (!d.text.trim()) return;
    try { await addDoc(collection(db, 'etablissements', A.eid, 'incidents'), { by:A.pid, byName:me().name, text:d.text.trim(), urgent:!!d.urgent, siteId:sid, room, taskId: t ? t.id : '', day: todayISO(), status:'open', createdAt: serverTimestamp() });
      closeModal(); toast('Problème signalé à la gérance.'); }
    catch (x) { $('#ierr').textContent = msg(x); } };
}

function vDispos(){
  const t = todayISO(), now = new Date(), mo = Math.max(0, Math.min(11, A.mo || 0)); A.mo = mo;
  const m0 = new Date(now.getFullYear(), now.getMonth() + mo, 1), y = m0.getFullYear(), mm = m0.getMonth(), nd = new Date(y, mm + 1, 0).getDate(), lead = (m0.getDay() + 6) % 7;
  let cells = ['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'].map(w => `<div class="wd">${w}</div>`).join('') + '<div></div>'.repeat(lead);
  for (let i = 1; i <= nd; i++) { const d = y + '-' + pad(mm + 1) + '-' + pad(i), x = dispoOf(A.pid, d), n = A.tasks.filter(k => k.day === d).length;
    cells += `<button type="button" class="${x ? 'k-' + x.kind : ''}${d === t ? ' tod' : ''}" data-a="sdispo" data-v="${d}"${d < t ? ' disabled' : ''} aria-label="${dLabel(d)}${x ? ', ' + esc(dispoTxt(x)) : ''}">${i}<small>${x ? esc(x.kind === 'indispo' && x.from != null ? hm(x.from) + '–' + hm(x.to) : DK[x.kind]) : n ? n + ' tâche' + (n > 1 ? 's' : '') : ''}</small></button>`; }
  const mine = A.dispos.filter(x => x.pid === A.pid && x.kind === 'indispo' && x.day >= t).sort((a,b) => a.day < b.day ? -1 : 1);
  const label = m0.toLocaleDateString('fr-FR', { month:'long', year:'numeric' });
  return `<header class="head"><div><h1>Mes dispos</h1><p class="sub">Indiquez quand vous n’êtes pas disponible, sur la journée ou sur une plage horaire.</p></div></header>
    <section class="panel"><div class="phead"><div class="weeknav"><button type="button" class="btn small" data-a="mo" data-v="-1" aria-label="Mois précédent"${mo === 0 ? ' disabled' : ''}>‹</button><h2 style="margin:0;min-width:150px;text-align:center">${label.charAt(0).toUpperCase() + label.slice(1)}</h2><button type="button" class="btn small" data-a="mo" data-v="1" aria-label="Mois suivant"${mo === 11 ? ' disabled' : ''}>›</button></div>
      <div class="legend"><span><i style="background:var(--danger)"></i>Indispo</span><span><i style="background:#2C5A3C"></i>Travail</span><span><i style="background:#8E939A"></i>Repos</span><span><i style="background:#7A6638"></i>Congés</span></div></div>
      <div class="mcal">${cells}</div></section>
    <section class="panel"><h2>Mes indisponibilités à venir</h2>${mine.length ? mine.map(x => `<div class="row"><span><b>${dTitle(x.day)}</b><br><span class="hint">${x.from != null ? 'De ' + hm(x.from) + ' à ' + hm(x.to) : 'Toute la journée'}</span></span><button type="button" class="link" data-a="sdispo" data-v="${x.day}">Modifier</button></div>`).join('') : '<p class="hint">Aucune pour l’instant.</p>'}</section>`;
}

/* ---------- arrivée par lien d'invitation ---------- */
let INV = new URLSearchParams(location.search).get('invite') || sessionStorage.getItem('gv_invite') || '';
if (INV) sessionStorage.setItem('gv_invite', INV);
function clearInvite(){ INV = ''; sessionStorage.removeItem('gv_invite'); history.replaceState(null, '', location.pathname); }
let itab = 'up';
function msgScreen(text, btn, fn){ root.innerHTML = `<div class="loading" style="padding:20px;text-align:center;flex-direction:column;gap:16px"><p style="max-width:420px;margin:0">${esc(text)}</p><button type="button" class="btn" id="mbtn">${esc(btn)}</button></div>`; $('#mbtn').onclick = fn; }
async function renderInvite(){
  root.innerHTML = '<div class="loading">Chargement de l’invitation…</div>';
  let inv = null; try { const s = await getDoc(doc(db, 'invitations', INV)); inv = s.exists() ? s.data() : null; } catch (_) {}
  if (!inv) return msgScreen('Ce lien d’invitation n’est plus valable. Demandez un nouveau lien à votre responsable.', 'Aller à la connexion', () => { clearInvite(); renderLogin(); });
  if (inv.used) return msgScreen('Ce lien a déjà servi. Connectez-vous avec le compte créé à ce moment-là.', 'Se connecter', () => { clearInvite(); tab = 'in'; renderLogin(); });
  const draw = () => {
    root.innerHTML = `<div class="login"><aside class="lside"><div class="brand">gouverne.</div><p>${esc(inv.etabName || 'Votre établissement')} vous invite à rejoindre son équipe.</p><small>Vous verrez vos tâches, vos horaires et vos dispos.</small></aside>
    <main class="lmain"><div class="lbox">
      <div class="tabs" role="tablist"><button type="button" data-it="up" aria-pressed="${itab === 'up'}">Créer mon compte</button><button type="button" data-it="in" aria-pressed="${itab === 'in'}">J’ai déjà un compte</button></div>
      <h1>Bonjour ${esc(inv.name)}</h1>
      <form id="fiv"><label class="field">Adresse email<input type="email" name="email" autocomplete="email" required></label>
        <label class="field">Mot de passe<input type="password" name="pw" autocomplete="${itab === 'up' ? 'new-password' : 'current-password'}" ${itab === 'up' ? 'minlength="8"' : ''} required>${itab === 'up' ? '<span class="hint">8 caractères minimum</span>' : ''}</label>
        <p class="err" id="err"></p><button class="btn primary" type="submit">${itab === 'up' ? 'Créer mon compte et rejoindre l’équipe' : 'Se connecter et rejoindre l’équipe'}</button></form>
      <div class="or">ou</div>
      <button type="button" class="btn gbtn" id="google">Continuer avec Google</button>
    </div></main></div>`;
    root.querySelectorAll('[data-it]').forEach(b => b.onclick = () => { itab = b.dataset.it; draw(); });
    const err = t => { $('#err').textContent = t; };
    $('#google').onclick = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { err(msg(e)); } };
    $('#fiv').onsubmit = async e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target));
      try { if (itab === 'up') { const c = await createUserWithEmailAndPassword(auth, d.email.trim(), d.pw); await updateProfile(c.user, { displayName: inv.name }); }
        else await signInWithEmailAndPassword(auth, d.email.trim(), d.pw); } catch (x) { err(msg(x)); } };
  };
  draw();
}
async function acceptInvite(user){
  root.innerHTML = '<div class="loading">Connexion à votre équipe…</div>';
  try {
    const s = await getDoc(doc(db, 'invitations', INV));
    if (!s.exists()) throw { code:'gv/invalid' };
    const inv = s.data();
    if (inv.used) { if (inv.usedBy === user.uid) { clearInvite(); return renderApp(user, inv.eid); } throw { code:'gv/used' }; }
    const u = await getDoc(doc(db, 'users', user.uid));
    if (u.exists() && u.data().eid && u.data().eid !== inv.eid) throw { code:'gv/other' };
    const b = writeBatch(db);
    b.set(doc(db, 'etablissements', inv.eid, 'membres', user.uid), { role:inv.role, personId:inv.personId, invite:INV, email:user.email || '', createdAt: serverTimestamp() });
    b.update(doc(db, 'etablissements', inv.eid, 'equipe', inv.personId), { uid:user.uid, access:'actif' });
    b.update(doc(db, 'invitations', INV), { used:true, usedBy:user.uid, usedAt: serverTimestamp() });
    b.set(doc(db, 'users', user.uid), { eid:inv.eid, createdAt: serverTimestamp() }, { merge:true });
    await b.commit(); clearInvite(); await renderApp(user, inv.eid); toast('Bienvenue dans l’équipe !');
  } catch (x) { console.error(x); msgScreen(msg(x), 'Se déconnecter', () => { clearInvite(); signOut(auth); }); }
}

/* ---------- actions ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || !A.eid) return;
  const a = el.dataset.a, v = el.dataset.v;
  if (a === 'view') { A.view = v; A.menu = false; window.scrollTo(0, 0); draw(); }
  else if (a === 'menu') { A.menu = true; draw(); }
  else if (a === 'menuclose') { A.menu = false; draw(); }
  else if (a === 'logout') { A.unsub.forEach(u => u()); A.unsub = []; A.eid = null; signOut(auth); }
  else if (a === 'rmode') { A.rmode = v; draw(); }
  else if (a === 'week') { A.week = (A.week || 0) + (+v); draw(); }
  else if (a === 'newresa') resaForm();
  else if (a === 'cellnew') resaForm({ siteId:el.dataset.site, room:el.dataset.room, day:el.dataset.day });
  else if (a === 'resa') resaDetail(v);
  else if (a === 'task') taskEdit(v);
  else if (a === 'newtask') newTask();
  else if (a === 'pday') { A.pday = v; draw(); }
  else if (a === 'tweek') { A.tweek = (A.tweek || 0) + (+v); draw(); }
  else if (a === 'padd') personForm();
  else if (a === 'pedit') personForm(v);
  else if (a === 'pinv') invite(v);
  else if (a === 'dcell') dispoEdit(el.dataset.p, el.dataset.d);
  else if (a === 'incok') updateDoc(doc(db, 'etablissements', A.eid, 'incidents', v), { status:'closed' }).then(() => toast('Marqué réglé.')).catch(x => toast(msg(x)));
  else if (a === 'smode') { A.smode = v; draw(); }
  else if (a === 'sday') { A.smode = 'agenda'; A.pday = v; draw(); }
  else if (a === 'stask') staffTask(v);
  else if (a === 'report') { A.menu = false; draw(); report(); }
  else if (a === 'sdispo') dispoEdit(A.pid, v);
  else if (a === 'mo') { A.mo = (A.mo || 0) + (+v); draw(); }
});
document.addEventListener('input', e => { if (e.target.id === 'rq') { A.q = e.target.value; const pos = e.target.selectionStart; draw(); const i = $('#rq'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch(_){} } } });

/* barre du haut sur téléphone : se cache quand on descend, revient quand on remonte */
let lastY = 0;
window.addEventListener('scroll', () => { const h = document.querySelector('.mhead'); if (!h) return; const y = window.scrollY;
  if (y > lastY + 6 && y > 80) h.classList.add('hide'); else if (y < lastY - 6 || y < 80) h.classList.remove('hide'); lastY = y; }, { passive:true });

/* ---------- aiguillage ---------- */
async function route(user){
  if (INV) { if (!user) return renderInvite(); return acceptInvite(user); }
  if (!user) { renderLogin(); return; }
  root.innerHTML = '<div class="loading">Connexion…</div>';
  try {
    const u = await getDoc(doc(db, 'users', user.uid));
    if (u.exists() && u.data().eid) await renderApp(user, u.data().eid);
    else renderSetup(user);
  } catch (x) { console.error(x); root.innerHTML = `<div class="loading" style="padding:20px;text-align:center">${esc(msg(x))}<br><br><button class="btn" onclick="location.reload()">Réessayer</button></div>`; }
}
onAuthStateChanged(auth, route);
</script>
</body>
</html>
