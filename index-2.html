<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Gouverne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ground:#F7F7F5;--surface:#fff;--sunk:#F2F2EF;--line:#E2E2DD;--line2:#CFCFCA;--ctrl:#8E939A;--ink:#1A1E24;--muted:#5A606A;--faint:#656B75;--navy:#1C2B3D;--navy2:#2A3A4E;--danger:#7A1F2B}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Schibsted Grotesk','Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;letter-spacing:-.015em}
.brand{font-size:30px;font-weight:900;letter-spacing:-.045em;line-height:1}
.btn{height:44px;padding:0 18px;border-radius:9px;border:1px solid var(--ctrl);background:var(--surface);font-weight:600;font-size:15px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{height:44px;border:1px solid var(--ctrl);border-radius:9px;padding:0 12px;background:var(--surface);color:var(--ink);font-weight:400;font-size:15px}
.field textarea{height:auto;min-height:110px;padding:10px 12px}
.err{color:var(--danger);font-weight:600;font-size:14px;margin:0;min-height:1em}
.hint{font-size:13px;color:var(--muted);font-weight:400}
/* auth */
.login{display:flex;min-height:100vh}
.lside{flex:0 0 40%;background:var(--navy);color:#E6EAF0;padding:40px;display:flex;flex-direction:column;justify-content:space-between}
.lside .brand{color:#fff}
.lside p{font-size:24px;line-height:1.35;margin:0;color:#fff;max-width:26ch}
.lside small{color:#A8B3C2}
.lmain{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.lbox{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.lbox h1{font-size:32px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:9px;border-radius:8px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,45,.12)}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:13px}.or::before,.or::after{content:'';flex:1;border-top:1px solid var(--line)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
form{display:flex;flex-direction:column;gap:14px}
/* setup */
.setup{min-height:100vh;display:flex;justify-content:center;padding:48px 20px}
.sbox{width:100%;max-width:760px;display:flex;flex-direction:column;gap:18px}
.sbox h1{font-size:32px}
.steps{display:flex;align-items:center;gap:6px}.steps span{width:26px;height:26px;border-radius:13px;border:2px solid var(--ctrl);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)}
.steps span.on{background:var(--ink);border-color:var(--ink);color:#fff}.steps i{width:28px;height:2px;background:var(--line2)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.type{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px;border:1px solid var(--line2);border-radius:14px;background:var(--surface)}
.type b{font-size:17px}.type small{color:var(--muted);font-size:14px}
.type[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunk)}
.sw{width:10px;height:10px;border-radius:5px;display:inline-block}
.foot{display:flex;justify-content:space-between;align-items:center}
/* app */
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--navy);color:#E6EAF0;padding:28px 16px;display:flex;flex-direction:column;gap:24px}
.side .brand{color:#fff;padding:0 10px}
.side small{color:#A8B3C2;padding:0 10px}
.me{margin-top:auto;padding:0 10px;display:flex;flex-direction:column;gap:8px}
.me button{background:none;border:1px solid #33465C;color:#DDE3EA;border-radius:8px;height:36px}
main{flex:1;min-width:0;padding:36px 44px 64px;display:flex;flex-direction:column;gap:22px}
main h1{font-size:36px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.panel h2{font-size:18px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.ok{background:var(--surface);border:1px solid var(--line);border-left:0;border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.dot{width:10px;height:10px;border-radius:5px;background:#2F6B3A;flex:none}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted)}
@media (max-width:800px){.login{flex-direction:column}.lside{flex:none;padding:24px;gap:16px}.lside p{font-size:18px}
  .app{flex-direction:column}.side{width:auto;flex-direction:row;align-items:center;padding:12px 14px;gap:12px}.side small{display:none}.me{margin:0 0 0 auto;flex-direction:row}
  main{padding:18px 14px 40px}main h1{font-size:26px}.sbox h1,.lbox h1{font-size:26px}}
</style>
</head>
<body>
<div id="root"><div class="loading">Chargement…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup, updateProfile, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, writeBatch, collection, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCdDMj6zPnITUcWC0SttCUjrfa0lmkUb24",
  authDomain: "gouverne.firebaseapp.com",
  projectId: "gouverne",
  storageBucket: "gouverne.firebasestorage.app",
  messagingSenderId: "956629676727",
  appId: "1:956629676727:web:f5d287fa0b6dda602ed332"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
setPersistence(auth, browserLocalPersistence); // on reste connecté

const $ = s => document.querySelector(s);
const root = $('#root');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PAL = [['#3F444B','#fff'],['#A88D63','#1F180A'],['#D2A24C','#2E2108'],['#D4A39B','#3B1D18'],['#6E7B5B','#fff'],['#4F6A6E','#fff']];

// Modèles de départ par type d'établissement
const TPL = {
  ch:{label:'Chambres d’hôtes',hint:'Quelques chambres, petit-déjeuner, parfois table d’hôtes ou soins',unitS:'Chambre',unitP:'Chambres',q:'Combien de chambres ?',n:4,
    poles:[['menage','Ménage',['Draps et serviettes changés','Salle de bain nettoyée','Sols aspirés et lavés','Produits d’accueil remis']],['accueil','Accueil',['Clés prêtes','Chambre vérifiée','Présentation des lieux']],['resto','Petit-déjeuner',['Mise en place','Service','Rangement']]],
    opts:[['Bouteille de vin','menage'],['Lit bébé','menage'],['Fleurs en chambre','menage'],['Arrivée tardive','accueil'],['Petit-déjeuner en chambre','resto']]},
  hotel:{label:'Petit hôtel',hint:'Réception, étages, petit-déjeuner, maintenance',unitS:'Chambre',unitP:'Chambres',q:'Combien de chambres ?',n:12,
    poles:[['menage','Étages',['Lit refait','Salle de bain','Sols','Minibar vérifié']],['accueil','Réception',['Check-in','Remise des clés','Paiement']],['resto','Petit-déjeuner',['Mise en place','Service','Rangement']],['maint','Maintenance',['Problème vérifié','Réparé ou signalé']]],
    opts:[['Lit bébé','menage'],['Champagne en chambre','menage'],['Arrivée tardive','accueil'],['Parking','accueil']]},
  gite:{label:'Gîte ou location',hint:'Un ou plusieurs logements entiers',unitS:'Logement',unitP:'Logements',q:'Combien de logements ?',n:2,
    poles:[['menage','Ménage',['Linge changé','Cuisine nettoyée','Salle de bain','Poubelles vidées']],['accueil','Accueil',['Clés ou boîte à code','État des lieux']],['maint','Entretien',['Jardin','Piscine','Petites réparations']]],
    opts:[['Lit bébé','menage'],['Linge fourni','menage'],['Arrivée autonome','accueil']]},
  conc:{label:'Conciergerie',hint:'Vous gérez des logements pour des propriétaires',unitS:'Logement',unitP:'Logements',q:'Combien de logements gérez-vous ?',n:10,
    poles:[['menage','Ménage',['Linge changé','Logement nettoyé','Photos de fin']],['accueil','Check-in',['Accueil des voyageurs','Remise des clés']],['linge','Linge',['Récupération','Dépôt blanchisserie','Livraison']],['maint','Maintenance',['Intervention','Compte rendu']]],
    opts:[['Kit d’accueil','menage'],['Lit bébé','menage'],['Arrivée tardive','accueil']]},
  resto:{label:'Restaurant',hint:'Ouverture, mise en place, cuisine, service',unitS:'Espace',unitP:'Espaces',q:'Combien d’espaces ? (salle, terrasse, cuisine…)',n:3,names:['Salle','Terrasse','Cuisine'],
    poles:[['open','Ouverture',['Alarme et lumières','Caisse ouverte','Terrasse installée']],['prep','Mise en place',['Tables dressées','Pain et boissons','Ardoise du jour']],['cuisine','Cuisine',['Préparations du jour','Températures relevées','Plan de travail nettoyé']],['service','Service',['Service midi','Service soir']],['menage','Ménage et plonge',['Vaisselle','Sols','Poubelles']]],
    opts:[['Anniversaire','service'],['Menu allergènes','cuisine']]},
  autre:{label:'Autre activité',hint:'Partez d’une base simple et adaptez-la',unitS:'Espace',unitP:'Espaces',q:'Combien d’espaces ou de lieux ?',n:2,
    poles:[['menage','Ménage',['Fait']],['accueil','Accueil',['Fait']]],opts:[]}
};

const ERR = {
  'auth/invalid-email':'Cette adresse email n’est pas valide.',
  'auth/missing-password':'Indiquez un mot de passe.',
  'auth/weak-password':'Le mot de passe doit faire au moins 6 caractères.',
  'auth/email-already-in-use':'Un compte existe déjà avec cette adresse. Connectez-vous plutôt.',
  'auth/invalid-credential':'Email ou mot de passe incorrect.',
  'auth/wrong-password':'Email ou mot de passe incorrect.',
  'auth/user-not-found':'Aucun compte avec cette adresse.',
  'auth/too-many-requests':'Trop d’essais. Patientez quelques minutes.',
  'auth/popup-closed-by-user':'La fenêtre Google a été fermée.',
  'auth/unauthorized-domain':'Ce site n’est pas encore autorisé dans Firebase (Authentication, Paramètres, Domaines autorisés).',
  'permission-denied':'Accès refusé par les règles de sécurité. Vérifiez qu’elles sont bien publiées.'
};
const msg = e => ERR[e && e.code] || ('Une erreur est survenue' + (e && e.code ? ' (' + e.code + ')' : '') + '.');

/* ---------- écran de connexion ---------- */
let tab = 'in';
function renderLogin(){
  root.innerHTML = `<div class="login"><aside class="lside"><div class="brand">gouverne.</div><p>Les chambres, l’équipe et les tâches de votre établissement, sur un seul écran.</p><small>Données hébergées en Europe. Vos données vous appartiennent.</small></aside>
  <main class="lmain"><div class="lbox">
    <div class="tabs" role="tablist"><button type="button" data-tab="in" aria-pressed="${tab==='in'}">Se connecter</button><button type="button" data-tab="up" aria-pressed="${tab==='up'}">Créer mon établissement</button></div>
    ${tab==='in' ? `<h1>Bonjour</h1>
      <form id="fin"><label class="field">Adresse email<input type="email" name="email" autocomplete="email" required></label>
      <label class="field">Mot de passe<input type="password" name="pw" autocomplete="current-password" required></label>
      <p class="err" id="err"></p><button class="btn primary" type="submit">Se connecter</button>
      <button type="button" class="link" id="forgot" style="align-self:flex-start">Mot de passe oublié ?</button></form>`
    : `<h1>Créez votre établissement</h1>
      <form id="fup"><label class="field">Votre prénom<input name="fn" autocomplete="given-name" required></label>
      <label class="field">Adresse email<input type="email" name="email" autocomplete="email" required></label>
      <label class="field">Mot de passe<input type="password" name="pw" autocomplete="new-password" minlength="8" required><span class="hint">8 caractères minimum</span></label>
      <p class="err" id="err"></p><button class="btn primary" type="submit">Créer mon compte</button></form>`}
    <div class="or">ou</div>
    <button type="button" class="btn gbtn" id="google"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continuer avec Google</button>
  </div></main></div>`;
  root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; renderLogin(); });
  const err = t => { $('#err').textContent = t; };
  $('#google').onclick = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch(e){ err(msg(e)); } };
  if (tab === 'in') {
    $('#fin').onsubmit = async e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target));
      try { await signInWithEmailAndPassword(auth, d.email.trim(), d.pw); } catch(x){ err(msg(x)); } };
    $('#forgot').onclick = async () => { const em = $('#fin [name=email]').value.trim(); if (!em) return err('Indiquez d’abord votre adresse email.');
      try { await sendPasswordResetEmail(auth, em); err(''); alert('Un email pour choisir un nouveau mot de passe vous a été envoyé.'); } catch(x){ err(msg(x)); } };
  } else {
    $('#fup').onsubmit = async e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target));
      try { const c = await createUserWithEmailAndPassword(auth, d.email.trim(), d.pw); await updateProfile(c.user, { displayName: d.fn.trim() }); } catch(x){ err(msg(x)); } };
  }
}

/* ---------- assistant de première connexion ---------- */
let setup = null;
function renderSetup(user){
  if (!setup) setup = { step:1, type:null, es:'', n:null, team:'', fn:(user.displayName||'').split(' ')[0] || '' };
  const st = setup, t = st.type ? TPL[st.type] : null;
  const steps = '<div class="steps">'+[1,2,3].map(i=>`<span class="${i<=st.step?'on':''}">${i}</span>`).join('<i></i>')+'</div>';
  let body = '';
  if (st.step === 1) body = `<h1>Bienvenue${st.fn ? ' ' + esc(st.fn) : ''}</h1><p class="hint" style="font-size:15px;margin:-8px 0 0">Quel est votre type d’établissement ? Gouverne se prépare en fonction.</p>
    <div class="types">${Object.entries(TPL).map(([k,v])=>`<button type="button" class="type" data-type="${k}" aria-pressed="${st.type===k}"><b>${v.label}</b><small>${v.hint}</small></button>`).join('')}</div>
    <div class="foot"><span></span><button type="button" class="btn primary" id="next" ${st.type?'':'disabled'}>Continuer</button></div>`;
  if (st.step === 2) body = `<h1>Votre établissement</h1>
    <form id="f2"><label class="field">Nom de l’établissement<input name="es" required value="${esc(st.es)}" placeholder="Par exemple : Bastide des Oliviers"></label>
    <label class="field">${t.q}<input name="n" type="number" min="1" max="60" value="${st.n || t.n}"></label>
    <div class="field">Vos pôles de travail, prêts à l’emploi<div class="chips">${t.poles.map((p,i)=>`<span class="chip"><i class="sw" style="background:${PAL[i%PAL.length][0]}"></i>${p[1]}</span>`).join('')}</div><span class="hint">Tout se modifie ensuite dans Réglages.</span></div>
    <div class="foot"><button type="button" class="link" id="back">Retour</button><button class="btn primary" type="submit">Continuer</button></div></form>`;
  if (st.step === 3) body = `<h1>Votre équipe</h1><p class="hint" style="font-size:15px;margin:-8px 0 0">Facultatif. Les prénoms, un par ligne. Vous leur enverrez leur accès ensuite.</p>
    <form id="f3"><label class="field">Prénoms<textarea name="team" placeholder="Inès&#10;Marc">${esc(st.team)}</textarea></label>
    <p class="err" id="err"></p>
    <div class="foot"><button type="button" class="link" id="back">Retour</button><button class="btn primary" type="submit" id="create">Créer mon espace</button></div></form>`;
  root.innerHTML = `<div class="setup"><div class="sbox"><div class="brand">gouverne.</div>${steps}${body}</div></div>`;
  root.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { st.type = b.dataset.type; st.n = null; renderSetup(user); });
  if ($('#next')) $('#next').onclick = () => { st.step = 2; renderSetup(user); };
  if ($('#back')) $('#back').onclick = () => { st.step--; renderSetup(user); };
  if ($('#f2')) $('#f2').onsubmit = e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target)); st.es = d.es.trim(); st.n = Math.max(1, +d.n || 1); st.step = 3; renderSetup(user); };
  if ($('#f3')) $('#f3').onsubmit = async e => { e.preventDefault(); st.team = new FormData(e.target).get('team') || '';
    $('#create').disabled = true; $('#create').textContent = 'Création…';
    try { await createEstablishment(user, st); setup = null; await route(user); }
    catch(x){ console.error(x); $('#err').textContent = msg(x); $('#create').disabled = false; $('#create').textContent = 'Créer mon espace'; } };
}

async function createEstablishment(user, st){
  const t = TPL[st.type];
  const eRef = doc(collection(db, 'etablissements'));
  const eid = eRef.id;
  const b = writeBatch(db);
  b.set(eRef, {
    name: st.es, type: st.type, unitS: t.unitS, unitP: t.unitP, ownerUid: user.uid, createdAt: serverTimestamp(),
    options: t.opts.map(o => ({ label:o[0], pole:o[1] })),
    settings: { heuresPaie:false, sync:false, recouche:0, photos:{}, durees:{ prep:1.5, accueil:0.5 } }
  });
  const ownerPid = 'p_' + user.uid.slice(0, 8);
  b.set(doc(db, 'etablissements', eid, 'equipe', ownerPid), { name: st.fn || user.displayName || 'Propriétaire', role:'proprio', uid:user.uid, poles: t.poles.slice(0,2).map(p=>p[0]), sites:['s1'], createdAt: serverTimestamp() });
  b.set(doc(db, 'etablissements', eid, 'membres', user.uid), { role:'proprio', personId: ownerPid, email: user.email || '', createdAt: serverTimestamp() });
  (st.team || '').split('\n').map(x => x.trim()).filter(Boolean).forEach((nm, i) => {
    b.set(doc(db, 'etablissements', eid, 'equipe', 'p' + Date.now().toString(36) + i), { name: nm, role:'collab', uid:null, poles: t.poles.map(p=>p[0]), sites:['s1'], access:'a_inviter', createdAt: serverTimestamp() });
  });
  const rooms = Array.from({ length: st.n || t.n }, (_, i) => (t.names && t.names[i]) || (t.unitS + ' ' + (i + 1)));
  b.set(doc(db, 'etablissements', eid, 'sites', 's1'), { name: st.es, rooms, order: 0 });
  t.poles.forEach((p, i) => b.set(doc(db, 'etablissements', eid, 'poles', p[0]), { name:p[1], color:PAL[i%PAL.length][0], fg:PAL[i%PAL.length][1], checks:p[2], fields:[], order:i }));
  await b.commit();
  await setDoc(doc(db, 'users', user.uid), { eid, createdAt: serverTimestamp() }, { merge: true });
}

/* ---------- tableau de bord (brique 1) ---------- */
async function renderApp(user, eid){
  root.innerHTML = '<div class="loading">Chargement de votre établissement…</div>';
  const e = await getDoc(doc(db, 'etablissements', eid));
  if (!e.exists()) { root.innerHTML = '<div class="loading">Établissement introuvable.</div>'; return; }
  const E = e.data();
  const [sites, poles, team] = await Promise.all(['sites','poles','equipe'].map(c => getDocs(collection(db, 'etablissements', eid, c))));
  const S = sites.docs.map(d => ({ id:d.id, ...d.data() })), P = poles.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b)=>a.order-b.order), T = team.docs.map(d => ({ id:d.id, ...d.data() }));
  const today = new Date().toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
  root.innerHTML = `<div class="app"><nav class="side"><div class="brand">gouverne.</div><small>${esc(E.name)}</small>
    <div class="me"><small style="padding:0">${esc(user.email || '')}</small><button type="button" id="out">Se déconnecter</button></div></nav>
  <main><h1>${today.charAt(0).toUpperCase() + today.slice(1)}</h1>
    <div class="ok" role="status"><span class="dot"></span><div><b>Votre établissement est enregistré.</b><br><span class="hint">Tout est sauvegardé en ligne : vous retrouverez vos données sur n’importe quel appareil.</span></div></div>
    <div class="grid">
      <section class="panel"><h2>${esc(E.unitP)}</h2>${S.map(s => s.rooms.map(r => `<div class="row"><span>${esc(r)}</span><span class="hint">${esc(s.name)}</span></div>`).join('')).join('')}</section>
      <section class="panel"><h2>Pôles</h2>${P.map(p => `<div class="row"><span style="display:flex;gap:8px;align-items:center"><i class="sw" style="background:${p.color}"></i>${esc(p.name)}</span><span class="hint">${p.checks.length} points</span></div>`).join('')}</section>
      <section class="panel"><h2>Équipe</h2>${T.map(m => `<div class="row"><b>${esc(m.name)}</b><span class="hint">${m.role==='proprio'?'Propriétaire':'Accès à envoyer'}</span></div>`).join('')}</section>
    </div>
  </main></div>`;
  $('#out').onclick = () => signOut(auth);
}

/* ---------- aiguillage ---------- */
async function route(user){
  if (!user) { renderLogin(); return; }
  root.innerHTML = '<div class="loading">Connexion…</div>';
  try {
    const u = await getDoc(doc(db, 'users', user.uid));
    if (u.exists() && u.data().eid) await renderApp(user, u.data().eid);
    else renderSetup(user);
  } catch (x) { console.error(x); root.innerHTML = `<div class="loading" style="padding:20px;text-align:center">${esc(msg(x))}<br><br><button class="btn" onclick="location.reload()">Réessayer</button></div>`; }
}
onAuthStateChanged(auth, route);
</script>
</body>
</html>
